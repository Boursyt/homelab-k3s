apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kps
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 91.8.1
      sourceRef: { kind: HelmRepository, name: prometheus-community, namespace: flux-system }
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3 }
  values:
    grafana:
      enabled: false
      forceDeployDashboards: true
      forceDeployDatasources: true
      sidecar:
        datasources:
          defaultDatasourceEnabled: false

    nodeExporter:
      enabled: false
      forceDeployDashboards: true
      operatingSystems:
        aix: { enabled: false }
        darwin: { enabled: false }

    alertmanager:
      enabled: false

    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false

    prometheus:
      enabled: false

    kubeApiServer:
      serviceMonitor:
        authorization:
          type: Bearer
          credentials: { name: vmagent-scrape-token, key: token }
    kubelet:
      serviceMonitor:
        authorization:
          type: Bearer
          credentials: { name: vmagent-scrape-token, key: token }
    coreDns:
      serviceMonitor:
        authorization:
          type: Bearer
          credentials: { name: vmagent-scrape-token, key: token }

    prometheusOperator:
      enabled: false

    kube-state-metrics:
      resources:
        requests: { cpu: 10m, memory: 96Mi }
        limits:   { memory: 192Mi }
