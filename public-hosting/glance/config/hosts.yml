- type: custom-api
  title: Hosts
  cache: 30s
  url: http://vmauth-public.monitoring.svc.cluster.local:8427/api/v1/query
  basic-auth: { username: "${VM_USER}", password: "${VM_PASSWORD}" }
  parameters:
    query: |
      sort_by_label(union(
        label_set(up{job="node-exporter",instance="aegis"}, "o", "1"),
        label_set(up{job="node-exporter",instance="keraunos"}, "o", "2"),
        label_set(up{job="node-exporter",instance="bident"}, "o", "3"),
        label_set(up{job="node-exporter",instance="harpe"}, "o", "4"),
        label_set(up{job="node-exporter",instance="kibisis"}, "o", "5"),
        label_set(up{job="node-exporter",instance="trident"}, "o", "6"),
        label_set((time() - node_boot_time_seconds{job="node-exporter"}) / 86400, "k", "days")
      ), "o")
  template: |
    <ul class="list list-gap-10">
    {{ range .JSON.Array "data.result" }}{{ if ne (.String "metric.k") "days" }}{{ $n := .String "metric.instance" }}
      <li class="kv">
        <span class="text-truncate"><span class="color-highlight">{{ $n }}</span> <span class="size-h6 color-subdue">{{ if or (eq $n "aegis") (eq $n "keraunos") }}Pi 5 · 8 GB · server{{ else if eq $n "bident" }}Pi 4 · 8 GB · server{{ else if eq $n "harpe" }}Pi 4 · 4 GB · agent{{ else if eq $n "kibisis" }}NAS · DXP2800{{ else if eq $n "trident" }}VPS · VPN + reverse proxy{{ end }}</span></span>
        <span class="shrink-0">{{ range $.JSON.Array "data.result" }}{{ if and (eq (.String "metric.k") "days") (eq (.String "metric.instance") $n) }}<span class="color-subdue">up {{ printf "%.0f" (.Float "value.1") }}d</span>{{ end }}{{ end }}{{ if eq (.Float "value.1") 1.0 }}<span class="color-positive">&nbsp;●</span>{{ else }}<span class="color-negative">&nbsp;● down</span>{{ end }}</span>
      </li>
    {{ end }}{{ end }}
    </ul>
