- type: custom-api
  title: Network
  cache: 30s
  url: http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/query
  basic-auth: { username: "${VM_USER}", password: "${VM_PASSWORD}" }
  parameters:
    query: |
      sort_by_label(union(
        label_set(max by (name, order) (gatus_results_endpoint_success{job="gatus",group="Network"}), "k", "ok"),
        label_set(max by (name) (gatus_results_duration_seconds{job="gatus",group="Network"}) * 1000, "k", "ms")
      ), "order")
  template: |
    <ul class="list list-gap-10">
    {{ range .JSON.Array "data.result" }}{{ if eq (.String "metric.k") "ok" }}{{ $i := .String "metric.name" }}
      <li class="kv"><span class="color-highlight text-truncate">{{ $i }}</span><span class="shrink-0"><span class="color-subdue">{{ range $.JSON.Array "data.result" }}{{ if and (eq (.String "metric.k") "ms") (eq (.String "metric.name") $i) }}{{ if lt (.Float "value.1") 10.0 }}{{ printf "%.1f" (.Float "value.1") }}{{ else }}{{ printf "%.0f" (.Float "value.1") }}{{ end }} ms{{ end }}{{ end }}</span> {{ if eq (.Float "value.1") 1.0 }}<span class="color-positive">●</span>{{ else }}<span class="color-negative">●</span>{{ end }}</span></li>
    {{ end }}{{ end }}
    </ul>
