apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-homeassistant-homeassistant-config
spec:
  capacity: { storage: 5Gi }
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-ssd
  mountOptions: [nfsvers=3, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.1.210/volume2/k3s/homeassistant/homeassistant-config
    volumeAttributes: { server: 192.168.1.210, share: /volume2/k3s, subDir: homeassistant/homeassistant-config }
  claimRef: { namespace: homeassistant, name: homeassistant-config }
