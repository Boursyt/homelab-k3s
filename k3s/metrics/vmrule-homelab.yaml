apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab
  namespace: monitoring
spec:
  groups:
    - name: backups
      rules:
        - alert: BackupStale
          expr: time() - kube_cronjob_status_last_successful_time{cronjob=~"pg-dump|restic|garage-backup|gitlab-toolbox-backup"} > 93600
          for: 10m
          labels: { topic: backups, severity: critical }
          annotations:
            summary: "Backup {{ $labels.cronjob }} has no success for more than 26 h"
    - name: cluster
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status!="true"} == 1
          for: 5m
          labels: { topic: infra, severity: critical }
          annotations:
            summary: "Node {{ $labels.node }} is not Ready"
        - alert: FluxNotReady
          expr: gotk_resource_info{ready!="True"} == 1
          for: 15m
          labels: { topic: gitops, severity: warning }
          annotations:
            summary: "Flux {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready"
        - alert: PodCrashLoop
          expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
          for: 10m
          labels: { topic: apps, severity: warning }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash looping"
        - alert: PodOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1 and on (namespace, pod, container) increase(kube_pod_container_status_restarts_total[10m]) > 0
          labels: { topic: apps, severity: warning }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOM killed"
    - name: storage
      rules:
        - alert: DiskAlmostFull
          expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|vfat",mountpoint!~"/var/lib/.*|/run.*"} / node_filesystem_size_bytes < 0.10
          for: 15m
          labels: { topic: storage, severity: warning }
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.mountpoint }} has less than 10% free"
    - name: hardware
      rules:
        - alert: SmartFailing
          expr: smartctl_device_smart_status == 0
          for: 5m
          labels: { topic: infra, severity: critical }
          annotations:
            summary: "SMART reports a failing disk {{ $labels.device }} on {{ $labels.instance }}"
        - alert: DriveSectorErrors
          expr: increase(smartctl_device_attribute{attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable|Reported_Uncorrect",attribute_value_type="raw"}[7d]) > 0
          labels: { topic: infra, severity: warning }
          annotations:
            summary: "New bad sectors on {{ $labels.device }} on {{ $labels.instance }}: {{ $labels.attribute_name }}"
        - alert: NvmeCriticalWarning
          expr: smartctl_device_critical_warning > 0 or increase(smartctl_device_media_errors[7d]) > 0 or smartctl_device_available_spare < smartctl_device_available_spare_threshold
          labels: { topic: infra, severity: critical }
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.instance }} reports a critical warning, media errors or low spare"
        - alert: NvmeWearHigh
          expr: smartctl_device_percentage_used > 80
          labels: { topic: infra, severity: warning }
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.instance }} is {{ $value }}% worn"
        - alert: DriveTooHot
          expr: smartctl_device_temperature{temperature_type="current"} > 65
          for: 15m
          labels: { topic: infra, severity: warning }
          annotations:
            summary: "Drive {{ $labels.device }} on {{ $labels.instance }} is at {{ $value }} C"
        - alert: SmartExporterDown
          expr: up{job=~".*smartctl.*"} == 0
          for: 10m
          labels: { topic: infra, severity: warning }
          annotations:
            summary: "SMART exporter on {{ $labels.instance }} is down"
        - alert: CpuTooHot
          expr: node_hwmon_temp_celsius{chip=~"platform_coretemp_.*|thermal_thermal_zone.*"} > 80
          for: 10m
          labels: { topic: infra, severity: warning }
          annotations:
            summary: "{{ $labels.instance }} CPU at {{ $value }} C"
        - alert: MemoryAlmostFull
          expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.08
          for: 15m
          labels: { topic: infra, severity: warning }
          annotations:
            summary: "{{ $labels.instance }} has less than 8% memory available"
        - alert: NasLinkDegraded
          expr: node_network_speed_bytes{instance="kibisis",device="eth0"} < 125000000
          for: 5m
          labels: { topic: infra, severity: warning }
          annotations:
            summary: "NAS link negotiated below 1 Gbit/s"
