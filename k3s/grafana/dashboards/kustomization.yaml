apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Homelab
configMapGenerator:
  - name: dashboard-k3s-traefik
    files: [k3s-traefik.json]
  - name: dashboard-postgres
    files: [postgres.json]
  - name: dashboard-nas-docker
    files: [nas-docker.json]
  - name: dashboard-plugs
    files: [plugs.json]
