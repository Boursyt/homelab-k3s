apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
  namespace: collabora
spec:
  interval: 1h
  chart:
    spec:
      chart: collabora-online
      version: 1.3.8
      sourceRef: { kind: HelmRepository, name: collabora, namespace: flux-system }
  upgrade:
    remediation: { retries: 3 }
  values:
    image:
      repository: docker.io/collabora/code
      tag: 26.04.6.1.1

    # one pod: several would need routing each document to the same pod
    replicaCount: 1
    autoscaling:
      enabled: false

    collabora:
      server_name: office.lab.pub.theoboursy.fr
      # Nextcloud calls back inside the cluster (richdocuments wopi_callback_url)
      aliasgroups:
        - host: http://nextcloud.nextcloud.svc.cluster.local:8080
      # TLS ends at Traefik; no capabilities (Pod Security restricted): no chroot mounts;
      # no admin console on a public host; the editor is shown in a frame of cloud.lab.pub
      # (the alias group only has the internal callback host)
      extra_params: >-
        --o:ssl.enable=false --o:ssl.termination=true
        --o:security.capabilities=false --o:mount_jail_tree=false
        --o:admin_console.enable=false
        --o:net.frame_ancestors=cloud.lab.pub.theoboursy.fr
      existingSecret:
        enabled: true
        secretName: collabora-admin
        usernameKey: username
        passwordKey: password
      # signs the WOPI requests; Nextcloud checks the signature
      proofKeysSecretRef: collabora-proof-key

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: [ALL] }

    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }
    nodeSelector:
      kubernetes.io/arch: amd64
