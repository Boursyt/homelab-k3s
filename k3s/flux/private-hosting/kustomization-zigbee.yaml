apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zigbee
  namespace: flux-system
spec:
  path: ./private-hosting/zigbee
  sourceRef: { kind: GitRepository, name: homelab }
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: false   # true once its inventory has been checked (flux tree kustomization zigbee)
  dependsOn:
    - { name: cert-manager }
    - { name: traefik }
    - { name: nfs }
    - { name: devices }
