apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups-hdd
  namespace: backup
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-ssd
  volumeName: nfs-backup-backups-hdd
  resources: { requests: { storage: 3Ti } }
