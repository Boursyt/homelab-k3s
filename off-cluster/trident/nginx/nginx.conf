worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

# 443: TLS passthrough by SNI, certificates stay in the cluster
stream {
    log_format sni '$remote_addr [$time_local] $ssl_preread_server_name -> $upstream_addr $status $bytes_sent/$bytes_received ${session_time}s';
    access_log /dev/stdout sni;
    error_log /dev/stderr warn;
    include /etc/nginx/stream.d/*.conf;
}

# 80: redirect to HTTPS only
http {
    server_tokens off;
    # read-only filesystem: temp files in the /tmp tmpfs
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    include /etc/nginx/conf.d/*.conf;
}
