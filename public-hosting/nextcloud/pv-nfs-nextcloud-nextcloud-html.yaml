apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-nextcloud-nextcloud-html
spec:
  capacity: { storage: 10Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-ssd
  mountOptions: [nfsvers=3, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.1.210/volume2/k3s/nextcloud/nextcloud-html
    volumeAttributes: { server: 192.168.1.210, share: /volume2/k3s, subDir: nextcloud/nextcloud-html }
  claimRef: { namespace: nextcloud, name: nextcloud-html }
