      - "[CERTIFICATE_EXPIRATION] > 336h"
  - name: Zigbee2MQTT
    group: Apps
    extra-labels: { icon: "zigbee2mqtt", href: "https://zigbee.lab.theoboursy.fr", order: "6" }   # Glance Apps block
    url: "https://zigbee.lab.theoboursy.fr/"
    interval: 1m
    alerts: [{ type: ntfy }]
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
