  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-ssd
  mountOptions: [nfsvers=3, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.1.51/volume2/k3s/gitea/data-act-runner-gitea-runner-actions-act-runner-0
    volumeAttributes: { server: 192.168.1.51, share: /volume2/k3s, subDir: gitea/data-act-runner-gitea-runner-actions-act-runner-0 }
  claimRef: { namespace: gitea, name: data-act-runner-gitea-runner-actions-act-runner-0 }
