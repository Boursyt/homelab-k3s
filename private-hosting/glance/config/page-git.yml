- name: Git
  width: wide
  head-widgets:
    - type: split-column
      max-columns: 3
      widgets:
        - $include: git-mrs.yml
        - $include: git-pipelines.yml
        - $include: git-mirrors.yml
  columns:
    - size: full
      widgets:
        - type: split-column
          max-columns: 2
          widgets:
            - $include: git-merged.yml
            - $include: git-gitlab.yml
        - type: split-column
          max-columns: 2
          widgets:
            - $include: git-gitops.yml
            - $include: doco-cd.yml
