- type: custom-api
  title: Public
  cache: 1m
  url: http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/query
  basic-auth: { username: "${VM_USER}", password: "${VM_PASSWORD}" }
  parameters:
    query: |
      sort_by_label(union(
        label_set(max by (name, icon, href, order) (gatus_results_endpoint_success{job="gatus-public",group="Homelab",order!=""}), "k", "ok"),
        label_set(max by (name) (gatus_results_duration_seconds{job="gatus-public",group="Homelab",order!=""}) * 1000, "k", "ms")
      ), "order")
  template: |
    <ul class="dynamic-columns list-gap-20 list-with-separator">
    {{ range .JSON.Array "data.result" }}{{ if eq (.String "metric.k") "ok" }}{{ $i := .String "metric.name" }}{{ $ok := eq (.Float "value.1") 1.0 }}{{ $name := .String "metric.name" }}
      <div class="monitor-site flex items-center gap-15">
        <img class="monitor-site-icon" src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/{{ .String "metric.icon" }}.svg" alt="" loading="lazy">
        <div class="grow min-width-0">
          <a class="size-h3 color-highlight text-truncate block" href="{{ .String "metric.href" }}" target="_blank" rel="noreferrer">{{ $name }}</a>
          <ul class="list-horizontal-text">
            {{ if $ok }}<li>OK</li>{{ else }}<li class="color-negative">ERROR</li>{{ end }}
            {{ range $.JSON.Array "data.result" }}{{ if and (eq (.String "metric.k") "ms") (eq (.String "metric.name") $i) }}<li>{{ printf "%.0f" (.Float "value.1") }}ms</li>{{ end }}{{ end }}
          </ul>
        </div>
        <div class="monitor-site-status-icon">
          {{ if $ok }}<svg fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" /></svg>
          {{ else }}<svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" /></svg>{{ end }}
        </div>
      </div>
    {{ end }}{{ end }}
    </ul>
