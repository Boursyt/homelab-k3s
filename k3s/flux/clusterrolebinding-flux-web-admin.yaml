# Web UI actions (reconcile, suspend, resume) for its anonymous user. Remove it for a read-only UI.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-admin
subjects:
  - { kind: Group, name: flux-admin, apiGroup: rbac.authorization.k8s.io }
roleRef: { kind: ClusterRole, name: flux-web-admin, apiGroup: rbac.authorization.k8s.io }
