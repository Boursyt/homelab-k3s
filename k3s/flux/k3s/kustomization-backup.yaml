apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup
  namespace: flux-system
spec:
  path: ./k3s/backup
  sourceRef: { kind: GitRepository, name: homelab }
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: false   # true once its inventory has been checked (flux tree kustomization backup)
  dependsOn:
    - { name: databases }
    - { name: nfs }
