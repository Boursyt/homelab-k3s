apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: vmalert
  namespace: monitoring
spec:
  selectAllByDefault: true
  # operator-generated non-root, read-only, no-capability containers
  useStrictSecurity: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: { type: RuntimeDefault }
  evaluationInterval: 60s
  externalLabels:
    prometheus: monitoring/kps-kube-prometheus-stack-prometheus
    prometheus_replica: prometheus-kps-kube-prometheus-stack-prometheus-0
  datasource:
    url: http://victoriametrics.monitoring.svc.cluster.local:8428
    basicAuth:
      username: { name: victoriametrics-auth, key: username }
      password: { name: victoriametrics-auth, key: password }
  remoteWrite:
    url: http://victoriametrics.monitoring.svc.cluster.local:8428
    basicAuth:
      username: { name: victoriametrics-auth, key: username }
      password: { name: victoriametrics-auth, key: password }
  remoteRead:
    url: http://victoriametrics.monitoring.svc.cluster.local:8428
    basicAuth:
      username: { name: victoriametrics-auth, key: username }
      password: { name: victoriametrics-auth, key: password }
  extraArgs:
    notifier.blackhole: "true"
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { memory: 256Mi }
