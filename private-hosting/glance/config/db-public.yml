- type: custom-api
  title: Postgres · public
  title-url: https://grafana.lab.theoboursy.fr/d/homelab-postgres
  cache: 30s
  url: http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/query
  basic-auth: { username: "${VM_USER}", password: "${VM_PASSWORD}" }
  parameters:
    query: |
      union(
        label_set(max(up{job="postgres",stack="public",role="primary"}) or vector(0), "k", "pup"),
        label_set(max(up{job="postgres",stack="public",role="replica"}) or vector(0), "k", "rup"),
        label_set(max(pgbouncer_up{stack="public"}) or vector(0), "k", "bup"),
        label_set(max(pg_replication_lag_seconds{stack="public",role="replica"}) or vector(0), "k", "lag"),
        label_set(sum(pg_stat_database_numbackends{stack="public",role="primary"}), "k", "conns"),
        label_set(max(pg_settings_max_connections{stack="public",role="primary"}), "k", "maxc"),
        label_set(sum(rate(pg_stat_database_xact_commit{stack="public",role="primary"}[5m])), "k", "tps"),
        label_set(sum(rate(pg_stat_database_xact_rollback{stack="public",role="primary"}[5m])), "k", "rb"),
        label_set(sum(increase(pg_stat_database_deadlocks{stack="public",role="primary"}[24h])), "k", "dl"),
        label_set(100 * sum(rate(pg_stat_database_blks_hit{stack="public",role="primary"}[5m])) / (sum(rate(pg_stat_database_blks_hit{stack="public",role="primary"}[5m])) + sum(rate(pg_stat_database_blks_read{stack="public",role="primary"}[5m]))) or vector(100), "k", "hit"),
        label_set(sum(rate(pgbouncer_stats_totals_queries_pooled_total{stack="public"}[5m])), "k", "qps"),
        label_set(1000 * sum(rate(pgbouncer_stats_totals_queries_duration_seconds_total{stack="public"}[5m])) / sum(rate(pgbouncer_stats_totals_queries_pooled_total{stack="public"}[5m])) or vector(0), "k", "qms"),
        label_set(sum(pgbouncer_pools_client_active_connections{stack="public",database!="pgbouncer"}), "k", "cla"),
        label_set(sum(pgbouncer_pools_client_waiting_connections{stack="public",database!="pgbouncer"}) or vector(0), "k", "clw"),
        label_set(sum(pgbouncer_pools_server_active_connections{stack="public",database!="pgbouncer"}) + sum(pgbouncer_pools_server_idle_connections{stack="public",database!="pgbouncer"}), "k", "sv"),
        label_set(max(label_replace(pg_static{stack="public",role="primary"}, "ver", "$1", "short_version", "(.*)")), "k", "ver"),
        label_set(pg_database_size_bytes{stack="public",role="primary",datname!~"template.*|postgres"} / 1e6, "k", "size"),
        label_set(pg_stat_database_numbackends{stack="public",role="primary",datname!~"template.*|postgres"}, "k", "dbc"),
        label_set(rate(pg_stat_database_xact_commit{stack="public",role="primary",datname!~"template.*|postgres"}[5m]), "k", "dbtx")
      )
  template: |
    {{ $pup := 0.0 }}{{ $rup := 0.0 }}{{ $bup := 0.0 }}{{ $lag := 0.0 }}{{ $conns := 0.0 }}{{ $maxc := 1.0 }}{{ $tps := 0.0 }}{{ $rb := 0.0 }}{{ $dl := 0.0 }}{{ $hit := 0.0 }}{{ $qps := 0.0 }}{{ $qms := 0.0 }}{{ $cla := 0.0 }}{{ $clw := 0.0 }}{{ $sv := 0.0 }}{{ $ver := "" }}
    {{ range .JSON.Array "data.result" }}{{ $k := .String "metric.k" }}{{ $x := .Float "value.1" }}{{ if eq $k "pup" }}{{ $pup = $x }}{{ end }}{{ if eq $k "rup" }}{{ $rup = $x }}{{ end }}{{ if eq $k "bup" }}{{ $bup = $x }}{{ end }}{{ if eq $k "lag" }}{{ $lag = $x }}{{ end }}{{ if eq $k "conns" }}{{ $conns = $x }}{{ end }}{{ if eq $k "maxc" }}{{ $maxc = $x }}{{ end }}{{ if eq $k "tps" }}{{ $tps = $x }}{{ end }}{{ if eq $k "rb" }}{{ $rb = $x }}{{ end }}{{ if eq $k "dl" }}{{ $dl = $x }}{{ end }}{{ if eq $k "hit" }}{{ $hit = $x }}{{ end }}{{ if eq $k "qps" }}{{ $qps = $x }}{{ end }}{{ if eq $k "qms" }}{{ $qms = $x }}{{ end }}{{ if eq $k "cla" }}{{ $cla = $x }}{{ end }}{{ if eq $k "clw" }}{{ $clw = $x }}{{ end }}{{ if eq $k "sv" }}{{ $sv = $x }}{{ end }}{{ if eq $k "ver" }}{{ $ver = .String "metric.short_version" }}{{ end }}{{ end }}
    {{ $cp := mul (div $conns $maxc) 100 }}
    <div class="kv"><span class="size-h5 color-highlight">PostgreSQL {{ $ver }}</span><span class="pill {{ if and (eq $pup 1.0) (eq $bup 1.0) (eq $rup 1.0) }}ok">● healthy{{ else if or (ne $pup 1.0) (ne $bup 1.0) }}bad">● down{{ else }}warn">● degraded{{ end }}</span></div>
    <div class="tbl" style="--c: 1.2fr 1.4fr .4fr">
      <div class="tr"><span class="color-highlight">primary</span><span class="dim">streaming source</span><span class="c">{{ if eq $pup 1.0 }}<span class="color-positive">●</span>{{ else }}<span class="color-negative">●</span>{{ end }}</span></div>
      <div class="tr"><span class="color-highlight">replica</span><span class="dim">lag {{ printf "%.0f" $lag }} s</span><span class="c">{{ if ne $rup 1.0 }}<span class="color-negative">●</span>{{ else if gt $lag 30.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></div>
      <div class="tr"><span class="color-highlight">PgBouncer</span><span class="dim">{{ printf "%.0f" $sv }} srv · {{ printf "%.0f" $cla }} clients</span><span class="c">{{ if ne $bup 1.0 }}<span class="color-negative">●</span>{{ else if gt $clw 0.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></div>
    </div>
    <div class="kv margin-top-15"><span class="size-h5 color-highlight">CONNECTIONS</span><span class="color-highlight">{{ printf "%.0f" $conns }} / {{ printf "%.0f" $maxc }}</span></div>
    <div class="bar"><div class="{{ if ge $cp 85.0 }} hot{{ end }}" style="width: {{ $cp }}%"></div></div>
    <div class="stat-row"><div><div class="color-highlight size-h4">{{ printf "%.1f" $tps }}</div><div class="size-h6">tx/s</div></div><div><div class="color-highlight size-h4">{{ printf "%.1f" $qps }}</div><div class="size-h6">queries/s</div></div><div><div class="color-highlight size-h4">{{ printf "%.1f" $qms }}</div><div class="size-h6">ms/query</div></div></div>
    <div class="stat-row"><div><div class="color-highlight size-h4">{{ printf "%.0f" $hit }}%</div><div class="size-h6">cache hit</div></div><div><div class="color-highlight size-h4">{{ printf "%.2f" $rb }}</div><div class="size-h6">rollbacks/s</div></div><div><div class="{{ if gt $dl 0.0 }}color-warn{{ else }}color-highlight{{ end }} size-h4">{{ printf "%.0f" $dl }}</div><div class="size-h6">deadlocks 24 h</div></div></div>
    <div class="sect">Databases</div>
    <div class="tbl" style="--c: 1.6fr .9fr .6fr .8fr">
      <div class="tr th"><span>name</span><span class="n">size</span><span class="n">conns</span><span class="n">tx/s</span></div>
    {{ range .JSON.Array "data.result" | sortByFloat "value.1" "desc" }}{{ if eq (.String "metric.k") "size" }}{{ $d := .String "metric.datname" }}{{ $s := .Float "value.1" }}
      <div class="tr"><span class="color-highlight">{{ $d }}</span><span class="n">{{ if ge $s 1000.0 }}{{ printf "%.2f" (div $s 1000.0) }} GB{{ else }}{{ printf "%.0f" $s }} MB{{ end }}</span><span class="n dim">{{ range $.JSON.Array "data.result" }}{{ if and (eq (.String "metric.k") "dbc") (eq (.String "metric.datname") $d) }}{{ printf "%.0f" (.Float "value.1") }}{{ end }}{{ end }}</span><span class="n dim">{{ range $.JSON.Array "data.result" }}{{ if and (eq (.String "metric.k") "dbtx") (eq (.String "metric.datname") $d) }}{{ printf "%.1f" (.Float "value.1") }}{{ end }}{{ end }}</span></div>
    {{ end }}{{ end }}
    </div>
