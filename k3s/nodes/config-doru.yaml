write-kubeconfig-mode: "0644"
server: https://192.168.1.200:6443
token-file: /etc/rancher/k3s/cluster-token
node-ip: 192.168.1.202
flannel-iface: enp2s0
tls-san:
  - 192.168.1.200
  - doru
etcd-arg:   # same timeouts as the other members (relaxed for SD cards while Pi servers remain)
  - heartbeat-interval=500
  - election-timeout=5000
etcd-snapshot-schedule-cron: "0 */12 * * *"
etcd-snapshot-retention: 10
etcd-s3: true
etcd-s3-config-secret: k3s-etcd-s3   # no other etcd-s3-* option, or the Secret is ignored
kubelet-arg:
  - kube-reserved=cpu=500m,memory=1536Mi
  - system-reserved=cpu=250m,memory=512Mi
  - eviction-hard=memory.available<300Mi,nodefs.available<10%,imagefs.available<10%
kube-apiserver-arg:
  - default-not-ready-toleration-seconds=60
  - default-unreachable-toleration-seconds=60
disable:
  - traefik   # Traefik is a Flux HelmRelease (k3s/traefik)
