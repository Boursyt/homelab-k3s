apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-ro
  namespace: backup
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: nfs-ssd
  volumeName: nfs-backup-nextcloud-ro
  resources: { requests: { storage: 300Gi } }
