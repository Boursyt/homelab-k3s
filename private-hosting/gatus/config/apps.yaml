endpoints:
  - name: Grafana
    group: Apps
    url: "https://grafana.lab.theoboursy.fr/api/health"
    interval: 1m
    alerts: [{ type: ntfy }]
    conditions:
      - "[STATUS] == 200"
      - "[BODY].database == ok"
      - "[CERTIFICATE_EXPIRATION] > 336h"
  - name: Gitea
    group: Apps
    extra-labels: { icon: "gitea", href: "https://git.lab.theoboursy.fr", order: "1" }   # Glance Apps block
    url: "https://git.lab.theoboursy.fr/api/healthz"
    interval: 1m
    alerts: [{ type: ntfy }]
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
  - name: Headlamp
    group: Apps
    url: "https://headlamp.lab.theoboursy.fr/"
    interval: 1m
    alerts: [{ type: ntfy }]
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
  - name: Glance
    group: Apps
    url: "https://lab.theoboursy.fr/"
    interval: 1m
    alerts: [{ type: ntfy }]
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
