apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: code-server
  labels: { app.kubernetes.io/name: code-server }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: code-server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: code-server }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: { kubernetes.io/arch: amd64 }
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # extensions from Open VSX (the registry the GitLab Web IDE also uses); already installed ones are skipped
        - name: extensions
          image: codercom/code-server:4.145.2
          command: [sh, -c, 'while read -r e; do [ -n "$e" ] && code-server --install-extension "$e" || true; done < /config/extensions.txt']
          env: [{ name: HOME, value: /home/coder }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: home, mountPath: /home/coder }
            - { name: tmp, mountPath: /tmp }
            - { name: extensions, mountPath: /config }
      containers:
        - name: code-server
          image: codercom/code-server:4.145.2
          args: [--auth, password, --bind-addr, "0.0.0.0:8080", --disable-telemetry, --disable-update-check, /home/coder/projects]
          env:
            - { name: HOME, value: /home/coder }
            - { name: PASSWORD, valueFrom: { secretKeyRef: { name: code-server, key: password } } }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 3Gi }
          volumeMounts:
            - { name: home, mountPath: /home/coder }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: home
          persistentVolumeClaim: { claimName: code-server }
        - name: tmp
          emptyDir: {}
        - name: extensions
          configMap: { name: extensions }
