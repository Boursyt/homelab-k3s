apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: manyfold
  labels: { app.kubernetes.io/name: valkey }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: valkey }
  template:
    metadata:
      labels: { app.kubernetes.io/name: valkey }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsUser: 999, runAsGroup: 999, runAsNonRoot: true }
      containers:
        - name: valkey
          image: valkey/valkey:9.1.2-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            periodSeconds: 15
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { memory: 128Mi }
      volumes:
        - { name: data, emptyDir: {} }
