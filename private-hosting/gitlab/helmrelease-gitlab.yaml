apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
  namespace: gitlab
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: gitlab
      version: 10.5.6
      sourceRef: { kind: HelmRepository, name: gitlab, namespace: flux-system }
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3 }
  values:
    global:
      hosts:
        domain: lab.theoboursy.fr
        https: true
        gitlab: { name: git.lab.theoboursy.fr }
      # Traefik Ingress instead of the Gateway API / Envoy of chart 10
      gatewayApi:
        { enabled: false, installEnvoy: false, configureCertmanager: false }
      ingress:
        enabled: true
        class: traefik
        provider: traefik
        configureCertmanager: false
        tls: { enabled: false }
      initialRootPassword:
        { secret: gitlab-initial-root-password, key: password }
      # NAS Postgres through PgBouncer (session mode, TLS required)
      psql:
        host: postgres.databases.svc.cluster.local
        port: 5432
        password: { secret: gitlab-db, key: password }
        main: { database: gitlab, username: gitlab }
      redis:
        host: valkey.gitlab.svc.cluster.local
        port: 6379
        auth: { enabled: true, secret: gitlab-valkey, key: password }
      # NAS Garage S3 (path style, endpoint in the connection secret)
      minio: { enabled: false }
      registry:
        enabled: true
        bucket: gitlab-registry
      kas: { enabled: false }
      # OptiPlex only (amd64); the scheduler spreads the pods over the 3 of them
      nodeSelector: { kubernetes.io/arch: amd64 }
      # SSH on the VIP, port 2222 (Gitea moved to 2223)
      shell: { port: 2222 }
      appConfig:
        object_store:
          enabled: true
          proxy_download: true
          connection: { secret: gitlab-object-storage, key: connection }
        artifacts: { bucket: gitlab-artifacts }
        lfs: { bucket: gitlab-lfs }
        uploads: { bucket: gitlab-uploads }
        packages: { bucket: gitlab-packages }
        externalDiffs: { enabled: true, bucket: gitlab-external-diffs }
        terraformState: { enabled: true, bucket: gitlab-terraform-state }
        ciSecureFiles: { enabled: true, bucket: gitlab-ci-secure-files }
        dependencyProxy: { enabled: true, bucket: gitlab-dependency-proxy }
        backups: { bucket: gitlab-backups, tmpBucket: gitlab-tmp }
    gitlab:
      # BYPASS_SCHEMA_VERSION on every component but migrations: the chart already sets it
      # on the migrations Job and a duplicate entry is refused by server-side apply
      gitaly:
        extraEnv: { BYPASS_SCHEMA_VERSION: true }
        persistence: { enabled: true, size: 120Gi, storageClass: iscsi }
      gitlab-exporter:
        extraEnv: { BYPASS_SCHEMA_VERSION: true }
      toolbox:
        extraEnv: { BYPASS_SCHEMA_VERSION: true }
        backups:
          # daily 01:00 Paris: repositories and database, to the bucket gitlab-backups (registry and uploads are already object storage)
          cron: { enabled: true, schedule: "0 0 * * *", extraArgs: "--skip registry" }
          objectStorage:
            config: { secret: gitlab-object-storage, key: backups-s3cfg }
      webservice:
        extraEnv: { BYPASS_SCHEMA_VERSION: true }
        minReplicas: 2
        maxReplicas: 2
        deployment:
          strategy:
            type: RollingUpdate
            rollingUpdate: { maxSurge: "10%", maxUnavailable: 0 }
          terminationGracePeriodSeconds: 60
      sidekiq:
        extraEnv: { BYPASS_SCHEMA_VERSION: true }
        minReplicas: 1
        maxReplicas: 2
        concurrency: 10
        timeout: 570
        deployment:
          strategy:
            type: RollingUpdate
            rollingUpdate: { maxSurge: "10%", maxUnavailable: 0 }
          terminationGracePeriodSeconds: 600
      gitlab-shell:
        extraEnv: { BYPASS_SCHEMA_VERSION: true }
        minReplicas: 2
        maxReplicas: 2
        service: { type: LoadBalancer }
        deployment:
          strategy:
            type: RollingUpdate
            rollingUpdate: { maxSurge: "10%", maxUnavailable: 0 }
          terminationGracePeriodSeconds: 60
    installCertmanager: false
    nginx-ingress: { enabled: false }
    prometheus: { install: false }
    gitlab-runner: { install: false }
    registry:
      enabled: true
      hpa: { minReplicas: 1, maxReplicas: 1 }
      storage:
        secret: gitlab-registry-storage
        key: config
        redirect: { disable: true }
      deployment:
        strategy:
          type: RollingUpdate
          rollingUpdate: { maxSurge: "10%", maxUnavailable: 0 }
        terminationGracePeriodSeconds: 60
