x-postgres-args: &postgres-args
  - postgres
  - -c
  - shared_buffers=512MB
  - -c
  - effective_cache_size=1536MB
  - -c
  - work_mem=16MB
  - -c
  - maintenance_work_mem=128MB
  - -c
  - max_connections=150
  - -c
  - random_page_cost=1.1
  - -c
  - checkpoint_completion_target=0.9
  - -c
  - max_wal_size=2GB
  - -c
  - password_encryption=scram-sha-256
  - -c
  - ssl=on
  - -c
  - ssl_cert_file=/etc/postgresql/tls/server.crt
  - -c
  - ssl_key_file=/etc/postgresql/tls/server.key
  - -c
  - hba_file=/etc/postgresql/pg_hba.conf

services:
  postgres-gitlab-primary:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    container_name: postgres-gitlab-primary
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:?missing in .env}
      PGBOUNCER_PASSWORD: ${PGBOUNCER_PASSWORD:?missing in .env}
    command: *postgres-args
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /volume2/stacks/postgres-gitlab/data/primary:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - /volume2/stacks/postgres-gitlab/tls:/etc/postgresql/tls:ro

  pgbouncer-gitlab:
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    container_name: pgbouncer-gitlab
    restart: unless-stopped
    ports:
      - "192.168.1.210:5435:5432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - /volume2/stacks/postgres-gitlab/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - /volume2/stacks/postgres-gitlab/pgbouncer/tls:/etc/pgbouncer/tls:ro
    depends_on:
      postgres-gitlab-primary: { condition: service_healthy }

  postgres-exporter-gitlab-primary:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: postgres-exporter-gitlab-primary
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres-gitlab-primary:5432/postgres?sslmode=require
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${MONITORING_PASSWORD:?missing in .env}
    ports:
      - "192.168.1.210:9192:9187"
    depends_on:
      postgres-gitlab-primary: { condition: service_healthy }

  pgbouncer-exporter-gitlab:
    image: quay.io/prometheuscommunity/pgbouncer-exporter:v0.12.1@sha256:30f31b6c2efdad3647f8182cc7c1a3a19e42bae5d17387694989f969371c230d
    container_name: pgbouncer-exporter-gitlab
    restart: unless-stopped
    environment:
      PGBOUNCER_EXPORTER_CONNECTION_STRING: postgres://monitoring:${MONITORING_PASSWORD:?missing in .env}@pgbouncer-gitlab:5432/pgbouncer?sslmode=require
    ports:
      - "192.168.1.210:9193:9127"
    depends_on:
      - pgbouncer-gitlab
