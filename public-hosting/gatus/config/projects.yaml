    interval: 3h
    alerts: [{ type: ntfy, failure-threshold: 1 }]
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
  - name: docker-online
    group: Projects (every 3 h)
    extra-labels: { desc: "mini-PaaS built on the Docker SDK", icon: "docker", order: "6", url: "https://dockeronline.theoboursy.fr" }
    url: "https://dockeronline.theoboursy.fr"
    interval: 3h
    alerts: [{ type: ntfy, failure-threshold: 1 }]
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
  - name: hall-of-gopher
    group: Projects (every 3 h)
    extra-labels: { desc: "Go image gallery on Cloud Run", icon: "go", order: "7", url: "https://gopher.theoboursy.fr" }
    url: "https://gopher.theoboursy.fr"
    interval: 3h
    alerts: [{ type: ntfy, failure-threshold: 1 }]
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
