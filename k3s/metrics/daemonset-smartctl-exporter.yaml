apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: smartctl-exporter
  namespace: monitoring
  labels: { app.kubernetes.io/name: smartctl-exporter }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: smartctl-exporter }
  template:
    metadata:
      labels: { app.kubernetes.io/name: smartctl-exporter }
    spec:
      nodeSelector: { kubernetes.io/arch: amd64 }
      tolerations:
        - { operator: Exists }
      containers:
        - name: smartctl-exporter
          image: quay.io/prometheuscommunity/smartctl-exporter:v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
          args: [--web.listen-address=:9633]
          ports:
            - { name: metrics, containerPort: 9633 }
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 96Mi }
