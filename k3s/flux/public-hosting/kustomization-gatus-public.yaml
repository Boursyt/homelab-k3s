apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus-public
  namespace: flux-system
spec:
  path: ./public-hosting/gatus
  sourceRef: { kind: GitRepository, name: homelab }
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: false   # true once its inventory has been checked (flux tree kustomization gatus-public)
  decryption: { provider: sops, secretRef: { name: sops-age } }
  dependsOn:
    - { name: cert-manager }
    - { name: traefik }
    - { name: databases }
