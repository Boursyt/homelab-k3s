apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-ssd
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.1.51
  share: /volume2/k3s
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
  onDelete: retain
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=3
  - hard
  - noatime
