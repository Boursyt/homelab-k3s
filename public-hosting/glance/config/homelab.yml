- name: Homelab
  width: wide
  head-widgets:
    - type: split-column
      max-columns: 4
      widgets:
        - $include: about.yml
        - $include: hosts.yml
        - $include: k3s.yml
        - $include: nas.yml
  columns:
    - size: small
      widgets:
        - $include: network.yml
        - $include: speedtest.yml
        - $include: traffic.yml
    - size: full
      widgets:
        - $include: projects.yml
        - $include: services.yml
    - size: small
      widgets:
        - $include: databases.yml
        - $include: stack.yml
