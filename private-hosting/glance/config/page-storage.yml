- name: Storage
  width: wide
  head-widgets:
    - type: split-column
      max-columns: 3
      widgets:
        - $include: backups-detail.yml
        - $include: valkey.yml
        - $include: nas.yml
  columns:
    - size: full
      widgets:
        - type: split-column
          max-columns: 3
          widgets:
            - $include: db-private.yml
            - $include: db-public.yml
            - $include: db-gitlab.yml
        - type: split-column
          max-columns: 2
          widgets:
            - $include: garage.yml
            - $include: pvc.yml
