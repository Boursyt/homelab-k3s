apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab
  namespace: flux-system
spec:
  # public GitLab mirror, read-only: no credentials, and works while Gitea (in the cluster) is down
  url: https://gitlab.com/Boursyt/homelab-k3s.git
  ref: { branch: main }
  interval: 1m
