# *.lab.pub goes to Traefik's public entrypoint (8443), which only has public routers;
# anything else is refused (closed port)
map $ssl_preread_server_name $backend {
    ~^([a-z0-9-]+\.)?lab\.pub\.theoboursy\.fr$  192.168.1.200:8443;
    default                                     127.0.0.1:1;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $backend;
    proxy_connect_timeout 5s;
}
