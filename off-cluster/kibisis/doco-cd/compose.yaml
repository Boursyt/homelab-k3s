services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.134.0@sha256:1d40f570403689c762c63009ade3d5d0dc24595bf40f9629a8ab3865e4ddb768
    container_name: doco-cd
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      SOPS_AGE_KEY_FILE: /run/secrets/age.agekey
      POLL_CONFIG: |
        - url: https://gitlab.com/Boursyt/homelab-k3s.git
          reference: main
          interval: 3m
          target: nas
    ports:
      - "192.168.1.210:9180:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume2/stacks/doco-cd/data:/data
      - /volume2/stacks/doco-cd/age.agekey:/run/secrets/age.agekey:ro
