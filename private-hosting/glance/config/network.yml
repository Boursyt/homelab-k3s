- type: custom-api
  title: Network · probes
  cache: 30s
  url: http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/query
  basic-auth: { username: "${VM_USER}", password: "${VM_PASSWORD}" }
  parameters:
    query: |
      sort_by_label(union(
        label_set(max by (name, order) (gatus_results_endpoint_success{job="gatus",group="Network"}), "k", "ok"),
        label_set(max by (name) (gatus_results_duration_seconds{job="gatus",group="Network"}) * 1000, "k", "ms")
      ), "order")
  template: |
    <div class="tbl" style="--c: 1.6fr .8fr .3fr">
      <div class="tr th"><span>probe</span><span class="n">latency</span><span class="c"></span></div>
    {{ range .JSON.Array "data.result" }}{{ if eq (.String "metric.k") "ok" }}{{ $i := .String "metric.name" }}{{ $ok := eq (.Float "value.1") 1.0 }}
      <div class="tr">
        <span class="color-highlight">{{ $i }}</span>
        <span class="n">{{ range $.JSON.Array "data.result" }}{{ if and (eq (.String "metric.k") "ms") (eq (.String "metric.name") $i) }}{{ if lt (.Float "value.1") 10.0 }}{{ printf "%.1f" (.Float "value.1") }}{{ else }}{{ printf "%.0f" (.Float "value.1") }}{{ end }} ms{{ end }}{{ end }}</span>
        <span class="c">{{ if $ok }}<span class="color-positive">●</span>{{ else }}<span class="color-negative">●</span>{{ end }}</span>
      </div>
    {{ end }}{{ end }}
    </div>
    <div class="size-h6 color-subdue margin-top-10">ping · DNS query · HTTPS (Traefik), checked by Gatus</div>
