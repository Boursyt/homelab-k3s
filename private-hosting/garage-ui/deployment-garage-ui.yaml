apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-ui
  namespace: garage-ui
  labels: { app.kubernetes.io/name: garage-ui }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: garage-ui }
  template:
    metadata:
      labels: { app.kubernetes.io/name: garage-ui }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: garage-ui }
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: garage-ui
          image: khairul169/garage-webui:1.1.0
          env:
            - { name: API_BASE_URL, value: "http://192.168.1.210:3903" }
            - { name: S3_ENDPOINT_URL, value: "http://192.168.1.210:3900" }
            - { name: S3_REGION, value: garage }
            - { name: API_ADMIN_KEY, valueFrom: { secretKeyRef: { name: garage-ui, key: admin-token } } }
            - { name: AUTH_USER_PASS, valueFrom: { secretKeyRef: { name: garage-ui, key: auth-user-pass } } }
          ports:
            - { name: http, containerPort: 3909 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 128Mi }
