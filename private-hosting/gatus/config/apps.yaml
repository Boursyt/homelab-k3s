  - name: Spoolman
    group: Apps
    extra-labels: { icon: "spoolman", href: "https://spoolman.lab.theoboursy.fr", order: "4" }   # Glance Apps block
    url: "https://spoolman.lab.theoboursy.fr/api/v1/health"
