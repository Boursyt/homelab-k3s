apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab
  namespace: flux-system
spec:
  # public GitHub mirror, read-only: no credentials, and works while Gitea (in the cluster) is down
  url: https://github.com/Boursyt/homelab-k3s
  ref: { branch: main }
  interval: 1m
