apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-data
  namespace: openwebui
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-ssd
  volumeName: nfs-openwebui-openwebui-data
  resources: { requests: { storage: 5Gi } }
