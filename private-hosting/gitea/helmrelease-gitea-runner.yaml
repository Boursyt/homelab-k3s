apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea-runner
  namespace: gitea
spec:
  interval: 1h
  chart:
    spec:
      chart: actions
      version: 0.0.3
      sourceRef: { kind: HelmRepository, name: gitea, namespace: flux-system }
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3 }
  values:
    enabled: true
    existingSecret: gitea-runner-secret
    existingSecretKey: token
    giteaRootURL: http://gitea-http.gitea.svc.cluster.local:6969
    statefulset:
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits:   { memory: 2Gi }
      actRunner:
        config: |
          log:
            level: info
          runner:
            labels:
              - "ubuntu-latest:docker://gitea/runner-images:ubuntu-latest"
              - "ubuntu-22.04:docker://gitea/runner-images:ubuntu-22.04"
          container:
            privileged: true
            require_docker: true
