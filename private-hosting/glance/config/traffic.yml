- type: custom-api
  title: Traffic · nodes
  cache: 30s
  url: http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/query
  basic-auth: { username: "${VM_USER}", password: "${VM_PASSWORD}" }
  parameters:
    query: |
      union(
        label_set(sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|veth.*|flannel.*|cni.*|wg.*|docker.*|br-.*|cali.*"}[5m])) / 1e6, "k", "rx"),
        label_set(sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|veth.*|flannel.*|cni.*|wg.*|docker.*|br-.*|cali.*"}[5m])) / 1e6, "k", "tx"),
        label_set(sum by (instance) (increase(node_network_receive_errs_total{device!~"lo|veth.*|flannel.*|cni.*|wg.*|docker.*|br-.*|cali.*"}[24h]) + increase(node_network_transmit_errs_total{device!~"lo|veth.*|flannel.*|cni.*|wg.*|docker.*|br-.*|cali.*"}[24h])), "k", "err")
      )
  template: |
    <div class="tbl" style="--c: 1.1fr .9fr .9fr .9fr">
      <div class="tr th"><span>node</span><span class="n">↓ rx MB/s</span><span class="n">↑ tx MB/s</span><span class="n">errors 24 h</span></div>
    {{ range .JSON.Array "data.result" | sortByFloat "value.1" "desc" }}{{ if eq (.String "metric.k") "rx" }}{{ $i := .String "metric.instance" }}
      <div class="tr">
        <span class="color-highlight">{{ $i }}</span>
        <span class="n">{{ printf "%.2f" (.Float "value.1") }}</span>
        <span class="n dim">{{ range $.JSON.Array "data.result" }}{{ if and (eq (.String "metric.k") "tx") (eq (.String "metric.instance") $i) }}{{ printf "%.2f" (.Float "value.1") }}{{ end }}{{ end }}</span>
        {{ $e := 0.0 }}{{ range $.JSON.Array "data.result" }}{{ if and (eq (.String "metric.k") "err") (eq (.String "metric.instance") $i) }}{{ $e = .Float "value.1" }}{{ end }}{{ end }}<span class="n {{ if gt $e 100.0 }}color-warn{{ else }}dim{{ end }}">{{ printf "%.0f" $e }}</span>
      </div>
    {{ end }}{{ end }}
    </div>
