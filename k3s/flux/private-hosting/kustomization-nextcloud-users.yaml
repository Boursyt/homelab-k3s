apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud-users
  namespace: flux-system
spec:
  path: ./private-hosting/nextcloud-users
  sourceRef: { kind: GitRepository, name: homelab }
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  decryption: { provider: sops, secretRef: { name: sops-age } }
  dependsOn:
    - { name: cert-manager }
    - { name: traefik }
    - { name: nextcloud }
