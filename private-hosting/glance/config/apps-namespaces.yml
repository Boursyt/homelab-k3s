- type: custom-api
  title: Apps · resources
  title-url: https://grafana.lab.theoboursy.fr
  cache: 1m
  url: http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/query
  basic-auth: { username: "${VM_USER}", password: "${VM_PASSWORD}" }
  parameters:
    query: |
      WITH (top = topk(12, sum by (namespace) (container_memory_working_set_bytes{container!=""})))
      union(
        label_set(top / 1e6, "k", "mem"),
        label_set((sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=""}[5m])) * 1000) and on (namespace) top, "k", "cpu"),
        label_set((sum by (namespace) (increase(kube_pod_container_status_restarts_total[24h]))) and on (namespace) top, "k", "rst")
      )
  template: |
    <div class="kv size-h6 color-subdue"><span>namespace</span><span>memory · cpu · restarts 24 h</span></div>
    <ul class="list list-gap-10 margin-top-10">
    {{ range .JSON.Array "data.result" | sortByFloat "value.1" "desc" }}{{ if eq (.String "metric.k") "mem" }}{{ $ns := .String "metric.namespace" }}
      <li>
        <div class="kv"><span class="color-highlight text-truncate">{{ $ns }}</span><span class="shrink-0 size-h6">
          <span class="color-highlight">{{ printf "%.0f" (.Float "value.1") }} MB</span>
          {{ range $.JSON.Array "data.result" }}{{ if and (eq (.String "metric.k") "cpu") (eq (.String "metric.namespace") $ns) }}<span class="color-subdue"> · {{ printf "%.0f" (.Float "value.1") }} m</span>{{ end }}{{ end }}
          {{ range $.JSON.Array "data.result" }}{{ if and (eq (.String "metric.k") "rst") (eq (.String "metric.namespace") $ns) }}<span class="{{ if gt (.Float "value.1") 3.0 }}color-negative{{ else if gt (.Float "value.1") 0.0 }}color-warn{{ else }}color-subdue{{ end }}"> · ⟲ {{ printf "%.0f" (.Float "value.1") }}</span>{{ end }}{{ end }}
        </span></div>
      </li>
    {{ end }}{{ end }}
    </ul>
