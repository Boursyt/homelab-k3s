services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
    container_name: victorialogs
    restart: unless-stopped
    user: "65534:65534"   # owner of ./data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -httpListenAddr=:9428
      - -httpAuth.username=%{VL_USER}
      - -httpAuth.password=%{VL_PASSWORD}
      - -memory.allowedPercent=10
    environment:
      VL_USER: ${VL_USER:?missing in .env}
      VL_PASSWORD: ${VL_PASSWORD:?missing in .env}
    ports:
      - "192.168.1.210:9428:9428"
    volumes:
      - /volume2/stacks/victorialogs/data:/storage
