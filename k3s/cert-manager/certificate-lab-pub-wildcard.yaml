apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-pub-wildcard
  namespace: kube-system
spec:
  secretName: lab-pub-wildcard-tls
  dnsNames:
    - lab.pub.theoboursy.fr
    - "*.lab.pub.theoboursy.fr"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    rotationPolicy: Always
