server:
  port: 8080
  assets-path: /app/assets

branding:
  app-name: lab.pub
  logo-text: "boursyt@lab:~$"
  hide-footer: true
  favicon-url: /assets/favicon.ico

document:
  head: |
    <style>
      @font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap; src: url('/assets/inter.woff2') format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; font-display: swap; src: url('/assets/jetbrains-mono.woff2') format('woff2'); }
      :root { --go: #00add8; --mono: 'JetBrains Mono', ui-monospace, monospace; }
      body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body::before {
        content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background: linear-gradient(180deg, rgb(0 173 216 / .22), rgb(0 173 216 / .07) 430px, transparent 760px);
      }
      .logo, .header-container, .widget-header, .size-h3, .size-h4, .stat-row, .kv > .shrink-0, .mono { font-family: var(--mono); }
      .header.widget-content-frame { background: none; border: none; box-shadow: none; position: relative; }
      .header::after {
        content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 2px; border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--go) 20%, var(--go) 80%, transparent);
      }
      .logo { width: auto; padding-inline: 0 1rem; font-weight: 700; border-right: none; color: var(--color-primary); }
      .logo::after { content: "▋"; margin-left: .35rem; color: var(--go); animation: cursor-blink 1.1s steps(1) infinite; }
      @keyframes cursor-blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .logo::after { animation: none; } }
      .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
      .kv > .shrink-0 { white-space: nowrap; }
      .bar { height: 7px; border-radius: 4px; background: var(--color-widget-background-highlight); margin: 6px 0 14px; overflow: hidden; }
      .bar > div { height: 100%; border-radius: 4px; background: var(--go); }
      .bar > div.data { background: var(--color-positive); }
      .bar > div.hot { background: var(--color-negative); }
      .stat-row { display: flex; justify-content: space-between; text-align: center; margin-top: 10px; }
      .stat-row > div { flex: 1; min-width: 0; }
      .stat-row .size-h6 { text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
      .head-widgets, .page-column {
        padding: 16px 20px 20px; border-radius: 22px;
        background: color-mix(in srgb, var(--color-widget-background) 55%, transparent);
        border: 1px solid color-mix(in srgb, var(--go) 22%, transparent);
        box-shadow: 0 18px 50px rgb(0 91 116 / .12);
      }
      .head-widgets .masonry-column > .widget { flex: 1; display: flex; flex-direction: column; }
      .head-widgets .masonry-column > .widget > .widget-content { flex: 1; }
      .about p { line-height: 1.6; }
      .cmd { display: flex; align-items: center; gap: .6rem; margin-top: 12px; padding: 8px 12px; border-radius: 8px;
             background: var(--color-widget-background-highlight); font-family: var(--mono); font-size: .85em; }
      .cmd span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cmd button { border: 1px solid var(--color-widget-content-border); border-radius: 6px; padding: 2px 8px; background: none;
                    color: inherit; font: inherit; cursor: pointer; }
      .cmd button:hover { color: var(--go); border-color: var(--go); }
      .repo { margin-top: 16px; padding: 14px; border-radius: 12px; border: 1px solid var(--color-widget-content-border);
              background: var(--color-widget-background-highlight); }
      .repo-head { display: flex; align-items: center; gap: .6rem; font-family: var(--mono); }
      .repo-head img { width: 20px; height: 20px; }
      .repo-head a { color: var(--color-text-highlight); font-weight: 600; }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .tags span { padding: 1px 8px; border-radius: 999px; font-size: .75em; font-family: var(--mono);
                   color: var(--go); background: color-mix(in srgb, var(--go) 12%, transparent); }
      .repo .cmd { background: var(--color-widget-background); }
    </style>
    <script>
      // every 30 s: swap the content of each titled widget (no reload)
      (() => {
        const key = (w) => {
          const h = w.querySelector(':scope > .widget-header');
          return h ? w.className + '|' + h.textContent.trim() : null;
        };
        const refresh = async () => {
          if (document.hidden || typeof pageData === 'undefined' || !pageData.slug) return;
          try {
            const r = await fetch(`${pageData.baseURL || ''}/api/pages/${pageData.slug}/content/`);
            if (!r.ok) return;
            const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
            const fresh = new Map();
            doc.querySelectorAll('.widget').forEach((w) => { const k = key(w); if (k) fresh.set(k, w); });
            let matched = 0, swapped = 0;
            document.querySelectorAll('#page-content .widget').forEach((w) => {
              const k = key(w); const n = k && fresh.get(k);
              if (n) matched++;
              const cur = w.querySelector(':scope > .widget-content'), upd = n && n.querySelector(':scope > .widget-content');
              if (cur && upd && cur.innerHTML !== upd.innerHTML) {
                cur.innerHTML = upd.innerHTML;
                // Glance only reveals lazy images on page load
                cur.querySelectorAll('img[loading=lazy]').forEach((i) => i.classList.add('cached', 'finished-transition'));
                swapped++;
              }
            });
            Object.assign(document.documentElement.dataset, { refreshAt: new Date().toLocaleTimeString(), refreshMatched: matched, refreshSwapped: swapped, refreshKeys: fresh.size });
          } catch (e) { document.documentElement.dataset.refreshError = String(e); }
        };
        setInterval(refresh, 30000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
      })();
    </script>

$include: theme.yml

pages:
  - $include: homelab.yml
