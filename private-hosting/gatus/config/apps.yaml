    group: Apps
    extra-labels: { icon: "manyfold", href: "https://manyfold.lab.theoboursy.fr", order: "5" }   # Glance Apps block
    url: "https://manyfold.lab.theoboursy.fr/health"
    interval: 1m
    alerts: [{ type: ntfy }]
    conditions:
