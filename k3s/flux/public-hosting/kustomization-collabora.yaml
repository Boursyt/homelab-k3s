apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: collabora
  namespace: flux-system
spec:
  path: ./public-hosting/collabora
  sourceRef: { kind: GitRepository, name: homelab }
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  prune: true
  decryption: { provider: sops, secretRef: { name: sops-age } }
  dependsOn:
    - { name: cert-manager }
    - { name: traefik }
