- type: custom-api
  title: Apps · problems
  title-url: https://headlamp.lab.theoboursy.fr
  cache: 1m
  url: http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/query
  basic-auth: { username: "${VM_USER}", password: "${VM_PASSWORD}" }
  parameters:
    query: |
      union(
        label_set(count(kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} == 1) or vector(0), "k", "bad"),
        label_set(sum(kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerError"}) or vector(0), "k", "wait"),
        label_set(count(increase(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[24h]) > 0) or vector(0), "k", "oom"),
        label_set(topk(6, sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[24h])) > 0), "k", "rst")
      )
  template: |
    {{ $bad := 0.0 }}{{ $wait := 0.0 }}{{ $oom := 0.0 }}{{ $n := 0 }}
    {{ range .JSON.Array "data.result" }}{{ $k := .String "metric.k" }}{{ if eq $k "bad" }}{{ $bad = .Float "value.1" }}{{ end }}{{ if eq $k "wait" }}{{ $wait = .Float "value.1" }}{{ end }}{{ if eq $k "oom" }}{{ $oom = .Float "value.1" }}{{ end }}{{ if eq $k "rst" }}{{ $n = add $n 1 }}{{ end }}{{ end }}
    <div class="kv"><span class="size-h5 color-highlight">CLUSTER HEALTH</span><span class="pill {{ if and (eq $bad 0.0) (eq $wait 0.0) }}ok">● all pods healthy{{ else }}bad">● {{ printf "%.0f" (add $bad $wait) }} unhealthy{{ end }}</span></div>
    <div class="stat-row">
      <div><div class="{{ if gt $bad 0.0 }}color-negative{{ else }}color-highlight{{ end }} size-h3">{{ printf "%.0f" $bad }}</div><div class="size-h6">not running</div></div>
      <div><div class="{{ if gt $wait 0.0 }}color-negative{{ else }}color-highlight{{ end }} size-h3">{{ printf "%.0f" $wait }}</div><div class="size-h6">crashing</div></div>
      <div><div class="{{ if gt $oom 0.0 }}color-warn{{ else }}color-highlight{{ end }} size-h3">{{ printf "%.0f" $oom }}</div><div class="size-h6">OOM 24 h</div></div>
    </div>
    <div class="sect">Restarts in the last 24 h</div>
    {{ if eq $n 0 }}<div class="color-subdue">none</div>{{ else }}
    <div class="tbl" style="--c: 1fr 2fr .5fr">
    {{ range .JSON.Array "data.result" | sortByFloat "value.1" "desc" }}{{ if eq (.String "metric.k") "rst" }}
      <div class="tr"><span class="dim">{{ .String "metric.namespace" }}</span><span class="color-highlight">{{ .String "metric.pod" }}</span><span class="n {{ if gt (.Float "value.1") 3.0 }}color-negative{{ else }}color-warn{{ end }}">{{ printf "%.0f" (.Float "value.1") }}</span></div>
    {{ end }}{{ end }}
    </div>{{ end }}
