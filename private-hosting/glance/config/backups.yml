- type: custom-api
  title: Backups
  cache: 5m
  url: http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/query
  basic-auth: { username: "${VM_USER}", password: "${VM_PASSWORD}" }
  parameters:
    query: |
      union(
        label_set((time() - max(last_over_time(backup_last_success_timestamp_seconds{job="pg-dump"}[30d]))) / 3600, "k", "a1"),
        label_set((time() - max(last_over_time(backup_last_success_timestamp_seconds{job="pg-dump-public"}[30d]))) / 3600, "k", "a2"),
        label_set((time() - max(last_over_time(backup_last_success_timestamp_seconds{job="pg-dump-gitlab"}[30d]))) / 3600, "k", "a3"),
        label_set((time() - max(last_over_time(backup_last_success_timestamp_seconds{job="restic"}[30d]))) / 3600, "k", "a4"),
        label_set((time() - max(last_over_time(kube_cronjob_status_last_successful_time{cronjob="garage-backup"}[30d]))) / 3600, "k", "a5"),
        label_set((time() - max(last_over_time(kube_cronjob_status_last_successful_time{cronjob="gitlab-toolbox-backup"}[30d]))) / 3600, "k", "a6")
      )
  template: |
    {{ $a1 := 999.0 }}{{ $a2 := 999.0 }}{{ $a3 := 999.0 }}{{ $a4 := 999.0 }}{{ $a5 := 999.0 }}{{ $a6 := 999.0 }}{{ $n := 0 }}
    {{ range .JSON.Array "data.result" }}{{ $k := .String "metric.k" }}{{ $x := .Float "value.1" }}{{ if eq $k "a1" }}{{ $a1 = $x }}{{ end }}{{ if eq $k "a2" }}{{ $a2 = $x }}{{ end }}{{ if eq $k "a3" }}{{ $a3 = $x }}{{ end }}{{ if eq $k "a4" }}{{ $a4 = $x }}{{ end }}{{ if eq $k "a5" }}{{ $a5 = $x }}{{ end }}{{ if eq $k "a6" }}{{ $a6 = $x }}{{ end }}{{ end }}
    {{ if gt $a1 26.0 }}{{ $n = add $n 1 }}{{ end }}{{ if gt $a2 26.0 }}{{ $n = add $n 1 }}{{ end }}{{ if gt $a3 26.0 }}{{ $n = add $n 1 }}{{ end }}{{ if gt $a4 26.0 }}{{ $n = add $n 1 }}{{ end }}{{ if gt $a5 26.0 }}{{ $n = add $n 1 }}{{ end }}{{ if gt $a6 26.0 }}{{ $n = add $n 1 }}{{ end }}
    <div class="kv"><span class="size-h5 color-highlight">ALL BACKUPS</span><span class="pill {{ if eq $n 0 }}ok">● UP TO DATE{{ else if lt $n 3 }}warn">● PARTIAL{{ else }}bad">● BROKEN{{ end }}</span></div>
    <div class="size-h6 color-subdue margin-top-10">{{ sub 6 $n }}/6 fresh (under 26 h)</div>
    <ul class="list list-gap-4 margin-top-10">
      {{ if gt $a1 26.0 }}<li class="kv size-h6"><span class="color-highlight text-truncate">Postgres dumps · private</span><span class="shrink-0 {{ if and (gt $a1 50.0) (lt $a1 999.0) }}color-negative{{ else }}color-warn{{ end }}">{{ if ge $a1 999.0 }}no run yet{{ else }}{{ printf "%.0f" $a1 }} h ago{{ end }}</span></li>{{ end }}
      {{ if gt $a2 26.0 }}<li class="kv size-h6"><span class="color-highlight text-truncate">Postgres dumps · public</span><span class="shrink-0 {{ if and (gt $a2 50.0) (lt $a2 999.0) }}color-negative{{ else }}color-warn{{ end }}">{{ if ge $a2 999.0 }}no run yet{{ else }}{{ printf "%.0f" $a2 }} h ago{{ end }}</span></li>{{ end }}
      {{ if gt $a3 26.0 }}<li class="kv size-h6"><span class="color-highlight text-truncate">Postgres dumps · GitLab</span><span class="shrink-0 {{ if and (gt $a3 50.0) (lt $a3 999.0) }}color-negative{{ else }}color-warn{{ end }}">{{ if ge $a3 999.0 }}no run yet{{ else }}{{ printf "%.0f" $a3 }} h ago{{ end }}</span></li>{{ end }}
      {{ if gt $a4 26.0 }}<li class="kv size-h6"><span class="color-highlight text-truncate">restic · NAS + GCS</span><span class="shrink-0 {{ if and (gt $a4 50.0) (lt $a4 999.0) }}color-negative{{ else }}color-warn{{ end }}">{{ if ge $a4 999.0 }}no run yet{{ else }}{{ printf "%.0f" $a4 }} h ago{{ end }}</span></li>{{ end }}
      {{ if gt $a5 26.0 }}<li class="kv size-h6"><span class="color-highlight text-truncate">Garage buckets</span><span class="shrink-0 {{ if and (gt $a5 50.0) (lt $a5 999.0) }}color-negative{{ else }}color-warn{{ end }}">{{ if ge $a5 999.0 }}no run yet{{ else }}{{ printf "%.0f" $a5 }} h ago{{ end }}</span></li>{{ end }}
      {{ if gt $a6 26.0 }}<li class="kv size-h6"><span class="color-highlight text-truncate">GitLab data</span><span class="shrink-0 {{ if and (gt $a6 50.0) (lt $a6 999.0) }}color-negative{{ else }}color-warn{{ end }}">{{ if ge $a6 999.0 }}no run yet{{ else }}{{ printf "%.0f" $a6 }} h ago{{ end }}</span></li>{{ end }}
    </ul>
