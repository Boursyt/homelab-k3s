# Was the Traefik bundled with k3s (HelmChart + HelmChartConfig); same release name, so Flux took the release over.
# k3s runs with `disable: [traefik]` (k3s/nodes/config-*.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 41.7.1   # Traefik v3.7.13
      sourceRef: { kind: HelmRepository, name: traefik, namespace: flux-system }
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3 }
  values:
    # k3s defaults, kept as they were
    image:
      repository: rancher/mirrored-library-traefik
      tag: 3.7.14
    priorityClassName: system-cluster-critical
    tolerations:
      - { key: CriticalAddonsOnly, operator: Exists }
      - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
    service:
      spec:
        ipFamilyPolicy: PreferDualStack
    providers:
      kubernetesIngress:
        publishedService:
          enabled: true

    ingressRoute:
      dashboard:
        enabled: true
        entryPoints: ["web", "websecure"]
        matchRule: Host(`traefik.lab.theoboursy.fr`)

    log:
      format: json
    accessLog:
      enabled: true
      format: json

    metrics:
      prometheus:
        service:
          enabled: true
        serviceMonitor:
          enabled: true
          # keep Traefik's own "service" label
          honorLabels: true
    resources:
      requests: { cpu: 75m, memory: 128Mi }
      limits:   { memory: 256Mi }
    deployment:
      replicas: 2
      podAnnotations:
        prometheus.io/port: "8082"
        prometheus.io/scrape: "true"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-kube-system
    # one pod per node: no room for a surge pod
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    # routers without an explicit entrypoint (all private Ingresses) only get web/websecure;
    # websecure-pub (VIP:8443, target of the public reverse proxy) only has the public routers
    ports:
      web:
        asDefault: true
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        asDefault: true
        http:
          tls:
            enabled: true
      websecure-pub:
        port: 8444
        exposedPort: 8443
        expose: { default: true }
        protocol: TCP
        http:
          tls:
            enabled: true
