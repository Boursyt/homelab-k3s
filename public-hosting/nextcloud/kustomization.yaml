apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextcloud
resources:
  - namespace.yaml
  - pv-nfs-nextcloud-nextcloud-html.yaml
  - pv-nfs-nextcloud-nextcloud-data.yaml
  - pvc-nextcloud-html.yaml
  - pvc-nextcloud-data.yaml
  - secret-nextcloud-admin.sops.yaml
  - secret-nextcloud-db.sops.yaml
  - secret-nextcloud-oidc.sops.yaml
  - deployment-valkey.yaml
  - service-valkey.yaml
  - helmrelease-nextcloud.yaml
  - ingress-nextcloud.yaml
  - networkpolicy-nextcloud.yaml
configMapGenerator:
  - name: nextcloud-nginx
    files: [default.conf=nginx.conf]
    options: { disableNameSuffixHash: true }
