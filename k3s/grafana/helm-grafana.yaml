apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: grafana
  namespace: kube-system
spec:
  repo: https://grafana-community.github.io/helm-charts
  chart: grafana
  version: 13.2.6
  targetNamespace: monitoring
  failurePolicy: abort
  valuesContent: |-
    service:
      type: ClusterIP
      port: 3300

    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password

    replicas: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: grafana
                app.kubernetes.io/instance: grafana
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
    podDisruptionBudget:
      minAvailable: 1

    persistence:
      enabled: false

    sidecar:
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
        searchNamespace: monitoring
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: monitoring
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
      resources:
        requests: { cpu: 10m, memory: 96Mi }
        limits:   { memory: 192Mi }

    # community dashboards, downloaded from grafana.com at start (pinned revision)
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: grafana-com
            folder: Homelab
            type: file
            disableDeletion: true
            options: { path: /var/lib/grafana/dashboards/grafana-com }
    dashboards:
      grafana-com:
        node-exporter-full: { gnetId: 1860, revision: 45 }

    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits:   { memory: 1024Mi }

    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - grafana.lab.theoboursy.fr
      path: /

    grafana.ini:
      server:
        root_url: https://grafana.lab.theoboursy.fr
      database:
        type: postgres
        host: postgres.databases.svc.cluster.local:5432
        name: grafana
        user: grafana
        ssl_mode: require
        max_open_conn: 5   # per replica; PgBouncer pool is 20
        max_idle_conn: 2

    envValueFrom:
      GF_DATABASE_PASSWORD:
        secretKeyRef:
          name: grafana-db
          key: password
      VM_PASSWORD:
        secretKeyRef:
          name: victoriametrics-auth
          key: password

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            uid: prometheus
            type: prometheus
            url: http://victoriametrics.monitoring.svc.cluster.local:8428
            access: proxy
            isDefault: true
            basicAuth: true
            basicAuthUser: prometheus
            jsonData:
              httpMethod: POST
              timeInterval: 60s
            secureJsonData:
              basicAuthPassword: $VM_PASSWORD

    initChownData:
      enabled: false
