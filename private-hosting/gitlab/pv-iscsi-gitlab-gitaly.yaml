apiVersion: v1
kind: PersistentVolume
metadata:
  name: iscsi-gitlab-gitaly
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 120Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: iscsi
  mountOptions: [noatime]
  iscsi:
    targetPortal: 192.168.1.210:3260
    iqn: iqn.2025-03.com.ugreen:target-1.96c8b8bfc0
    lun: 0
    fsType: ext4
    chapAuthSession: true
    secretRef:
      name: gitlab-iscsi-chap
      namespace: gitlab
