apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-gitlab-valkey
spec:
  capacity: { storage: 2Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-ssd
  mountOptions: [nfsvers=3, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.1.210/volume2/k3s/gitlab/valkey
    volumeAttributes: { server: 192.168.1.210, share: /volume2/k3s, subDir: gitlab/valkey }
  claimRef: { namespace: gitlab, name: valkey }
