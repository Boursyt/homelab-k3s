workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages: [validate, merge, renovate]

variables:
  GIT_DEPTH: "0"

gitleaks:
  stage: validate
  image: { name: "ghcr.io/gitleaks/gitleaks:v8.30.1", entrypoint: [""] }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - gitleaks git --no-banner --redact --log-opts="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD" .

render:
  stage: validate
  image: { name: "ghcr.io/fluxcd/flux-cli:v2.10.0", entrypoint: [""] }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - sh .gitea/validate.sh
  artifacts:
    paths: [rendered/]
    expire_in: 1 day

kubeconform:
  stage: validate
  needs: [render]
  image: { name: "ghcr.io/yannh/kubeconform:v0.8.0-alpine", entrypoint: [""] }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - >-
      /kubeconform -strict -summary -ignore-missing-schemas
      -schema-location default
      -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      rendered

merge:
  stage: merge
  needs: [gitleaks, render, kubeconform]
  image: curlimages/curl:8.11.1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^renovate\/manual-/
  script:
    - |
      code=$(curl -sS -o /tmp/out -w '%{http_code}' -X PUT \
        -H "PRIVATE-TOKEN: $MERGE_TOKEN" \
        --data 'squash=true' --data 'should_remove_source_branch=true' --data 'auto_merge=true' \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/merge")
      echo "HTTP $code"; cat /tmp/out; echo
      case "$code" in 200|202) exit 0 ;; esac
      state=$(curl -sS -H "PRIVATE-TOKEN: $MERGE_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID" | grep -o '"state":"[a-z]*"' | head -1 | cut -d'"' -f4)
      echo "merge request state: $state"
      [ "$state" = merged ]

renovate:
  stage: renovate
  image: { name: "ghcr.io/renovatebot/renovate:44.235.1", entrypoint: [""] }
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_CONFIG_FILE: .gitea/renovate.json
    LOG_LEVEL: info
  script:
    - renovate
