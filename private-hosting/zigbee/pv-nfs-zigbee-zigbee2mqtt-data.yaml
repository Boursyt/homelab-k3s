apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-zigbee-zigbee2mqtt-data
spec:
  capacity: { storage: 1Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-ssd
  mountOptions: [nfsvers=3, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.1.210/volume2/k3s/zigbee/zigbee2mqtt-data
    volumeAttributes: { server: 192.168.1.210, share: /volume2/k3s, subDir: zigbee/zigbee2mqtt-data }
  claimRef: { namespace: zigbee, name: zigbee2mqtt-data }
