apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-manyfold-models
spec:
  capacity: { storage: 1Ti }
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-ssd
  mountOptions: [nfsvers=3, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.1.51/volume1/models
    volumeAttributes: { server: 192.168.1.51, share: /volume1/models }
  claimRef: { namespace: manyfold, name: models }
