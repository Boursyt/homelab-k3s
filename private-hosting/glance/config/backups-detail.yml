- type: custom-api
  title: Backups · detail
  cache: 5m
  url: http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/query
  basic-auth: { username: "${VM_USER}", password: "${VM_PASSWORD}" }
  parameters:
    query: |
      union(
        label_set((time() - max(last_over_time(backup_last_success_timestamp_seconds{job="pg-dump"}[30d]))) / 3600, "k", "a1"),
        label_set((time() - max(last_over_time(backup_last_success_timestamp_seconds{job="pg-dump-public"}[30d]))) / 3600, "k", "a2"),
        label_set((time() - max(last_over_time(backup_last_success_timestamp_seconds{job="pg-dump-gitlab"}[30d]))) / 3600, "k", "a3"),
        label_set((time() - max(last_over_time(backup_last_success_timestamp_seconds{job="restic"}[30d]))) / 3600, "k", "a4"),
        label_set((time() - max(last_over_time(kube_cronjob_status_last_successful_time{cronjob="garage-backup"}[30d]))) / 3600, "k", "a5"),
        label_set((time() - max(last_over_time(kube_cronjob_status_last_successful_time{cronjob="gitlab-toolbox-backup"}[30d]))) / 3600, "k", "a6"),
        label_set(max(last_over_time(backup_size_bytes{job="pg-dump"}[30d])) / 1e6, "k", "s1"),
        label_set(max(last_over_time(backup_size_bytes{job="pg-dump-public"}[30d])) / 1e6, "k", "s2"),
        label_set(max(last_over_time(backup_size_bytes{job="pg-dump-gitlab"}[30d])) / 1e6, "k", "s3"),
        label_set(max(last_over_time(backup_size_bytes{job="restic"}[30d])) / 1e6, "k", "s4"),
        label_set(max(last_over_time(backup_snapshots{job="restic"}[30d])), "k", "snaps")
      )
  template: |
    {{ $a1 := 999.0 }}{{ $s1 := 0.0 }}{{ $a2 := 999.0 }}{{ $s2 := 0.0 }}{{ $a3 := 999.0 }}{{ $s3 := 0.0 }}{{ $a4 := 999.0 }}{{ $s4 := 0.0 }}{{ $a5 := 999.0 }}{{ $s5 := 0.0 }}{{ $a6 := 999.0 }}{{ $s6 := 0.0 }}{{ $snaps := 0.0 }}
    {{ range .JSON.Array "data.result" }}{{ $k := .String "metric.k" }}{{ $x := .Float "value.1" }}{{ if eq $k "a1" }}{{ $a1 = $x }}{{ end }}{{ if eq $k "s1" }}{{ $s1 = $x }}{{ end }}{{ if eq $k "a2" }}{{ $a2 = $x }}{{ end }}{{ if eq $k "s2" }}{{ $s2 = $x }}{{ end }}{{ if eq $k "a3" }}{{ $a3 = $x }}{{ end }}{{ if eq $k "s3" }}{{ $s3 = $x }}{{ end }}{{ if eq $k "a4" }}{{ $a4 = $x }}{{ end }}{{ if eq $k "s4" }}{{ $s4 = $x }}{{ end }}{{ if eq $k "a5" }}{{ $a5 = $x }}{{ end }}{{ if eq $k "s5" }}{{ $s5 = $x }}{{ end }}{{ if eq $k "a6" }}{{ $a6 = $x }}{{ end }}{{ if eq $k "s6" }}{{ $s6 = $x }}{{ end }}{{ if eq $k "snaps" }}{{ $snaps = $x }}{{ end }}{{ end }}
    <div class="tbl" style="--c: 2.4fr .8fr 1fr .3fr">
      <div class="tr th"><span>backup</span><span class="n">size</span><span class="n">last run</span><span class="c"></span></div>
      <div class="tr"><span class="color-highlight">pg dump · private <span class="dim">02:30</span></span><span class="n dim">{{ if gt $s1 0.0 }}{{ if ge $s1 1000.0 }}{{ printf "%.1f" (div $s1 1000.0) }} GB{{ else }}{{ printf "%.0f" $s1 }} MB{{ end }}{{ else }}–{{ end }}</span><span class="n">{{ if ge $a1 999.0 }}<span class="color-warn">no run yet</span>{{ else if ge $a1 24.0 }}{{ printf "%.0f" (div $a1 24.0) }} d ago{{ else }}{{ printf "%.0f" $a1 }} h ago{{ end }}</span><span class="c">{{ if and (gt $a1 50.0) (lt $a1 999.0) }}<span class="color-negative">●</span>{{ else if gt $a1 26.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></div>
      <div class="tr"><span class="color-highlight">pg dump · public <span class="dim">02:30</span></span><span class="n dim">{{ if gt $s2 0.0 }}{{ if ge $s2 1000.0 }}{{ printf "%.1f" (div $s2 1000.0) }} GB{{ else }}{{ printf "%.0f" $s2 }} MB{{ end }}{{ else }}–{{ end }}</span><span class="n">{{ if ge $a2 999.0 }}<span class="color-warn">no run yet</span>{{ else if ge $a2 24.0 }}{{ printf "%.0f" (div $a2 24.0) }} d ago{{ else }}{{ printf "%.0f" $a2 }} h ago{{ end }}</span><span class="c">{{ if and (gt $a2 50.0) (lt $a2 999.0) }}<span class="color-negative">●</span>{{ else if gt $a2 26.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></div>
      <div class="tr"><span class="color-highlight">pg dump · GitLab <span class="dim">02:30</span></span><span class="n dim">{{ if gt $s3 0.0 }}{{ if ge $s3 1000.0 }}{{ printf "%.1f" (div $s3 1000.0) }} GB{{ else }}{{ printf "%.0f" $s3 }} MB{{ end }}{{ else }}–{{ end }}</span><span class="n">{{ if ge $a3 999.0 }}<span class="color-warn">no run yet</span>{{ else if ge $a3 24.0 }}{{ printf "%.0f" (div $a3 24.0) }} d ago{{ else }}{{ printf "%.0f" $a3 }} h ago{{ end }}</span><span class="c">{{ if and (gt $a3 50.0) (lt $a3 999.0) }}<span class="color-negative">●</span>{{ else if gt $a3 26.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></div>
      <div class="tr"><span class="color-highlight">restic → NAS + GCS <span class="dim">03:30</span></span><span class="n dim">{{ if gt $s4 0.0 }}{{ if ge $s4 1000.0 }}{{ printf "%.1f" (div $s4 1000.0) }} GB{{ else }}{{ printf "%.0f" $s4 }} MB{{ end }}{{ else }}–{{ end }}</span><span class="n">{{ if ge $a4 999.0 }}<span class="color-warn">no run yet</span>{{ else if ge $a4 24.0 }}{{ printf "%.0f" (div $a4 24.0) }} d ago{{ else }}{{ printf "%.0f" $a4 }} h ago{{ end }}</span><span class="c">{{ if and (gt $a4 50.0) (lt $a4 999.0) }}<span class="color-negative">●</span>{{ else if gt $a4 26.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></div>
      <div class="tr"><span class="color-highlight">Garage buckets <span class="dim">03:00</span></span><span class="n dim">–</span><span class="n">{{ if ge $a5 999.0 }}<span class="color-warn">no run yet</span>{{ else if ge $a5 24.0 }}{{ printf "%.0f" (div $a5 24.0) }} d ago{{ else }}{{ printf "%.0f" $a5 }} h ago{{ end }}</span><span class="c">{{ if and (gt $a5 50.0) (lt $a5 999.0) }}<span class="color-negative">●</span>{{ else if gt $a5 26.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></div>
      <div class="tr"><span class="color-highlight">GitLab data <span class="dim">00:00 UTC</span></span><span class="n dim">–</span><span class="n">{{ if ge $a6 999.0 }}<span class="color-warn">no run yet</span>{{ else if ge $a6 24.0 }}{{ printf "%.0f" (div $a6 24.0) }} d ago{{ else }}{{ printf "%.0f" $a6 }} h ago{{ end }}</span><span class="c">{{ if and (gt $a6 50.0) (lt $a6 999.0) }}<span class="color-negative">●</span>{{ else if gt $a6 26.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></div>
    </div>
    <div class="stat-row"><div><div class="color-highlight size-h4">{{ printf "%.0f" $snaps }}</div><div class="size-h6">restic snapshots</div></div></div>
