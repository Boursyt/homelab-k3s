apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner-amd64
  namespace: gitlab-managed
spec:
  interval: 1h
  chart:
    spec:
      chart: gitlab-runner
      version: 0.94.3
      sourceRef: { kind: HelmRepository, name: gitlab, namespace: flux-system }
  upgrade:
    remediation: { retries: 3 }
  values:
    gitlabUrl: https://gitlab.com
    replicas: 2
    concurrent: 3
    nodeSelector: { kubernetes.io/arch: amd64 }
    rbac: { create: true }
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
    runners:
      secret: gitlab-managed-runner-amd64
      config: |
        [[runners]]
          [runners.kubernetes]
            namespace = "{{ .Release.Namespace }}"
            image = "alpine"
            [runners.kubernetes.node_selector]
              "kubernetes.io/arch" = "amd64"
