apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud
  namespace: nextcloud
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure-pub
spec:
  ingressClassName: traefik
  rules:
    - host: cloud.lab.pub.theoboursy.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: nextcloud, port: { name: http } }
