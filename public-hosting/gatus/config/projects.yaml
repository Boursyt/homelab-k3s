    interval: 3h
    alerts: [{ type: ntfy, failure-threshold: 1 }]
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
  - name: infra-monitoring
    group: Projects (every 3 h)
    extra-labels: { desc: "serverless Grafana on AWS Lambda", icon: "grafana", order: "5", url: "https://monitoring.theoboursy.fr" }
