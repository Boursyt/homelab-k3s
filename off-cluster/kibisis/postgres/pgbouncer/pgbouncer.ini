[databases]
* = host=postgres-primary port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer
auth_query = SELECT uname, phash FROM pgbouncer.user_lookup($1)
auth_dbname = postgres
pool_mode = session
max_client_conn = 500
default_pool_size = 20
ignore_startup_parameters = extra_float_digits,search_path
admin_users = postgres
stats_users = monitoring
; drop clients killed without closing TCP (power cut) in ~2 min
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 6

client_tls_sslmode = require
client_tls_key_file = /etc/pgbouncer/tls/server.key
client_tls_cert_file = /etc/pgbouncer/tls/server.crt
