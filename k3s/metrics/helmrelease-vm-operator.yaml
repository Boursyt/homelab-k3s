apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-operator
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-operator
      version: 0.68.1
      sourceRef: { kind: HelmRepository, name: victoriametrics, namespace: flux-system }
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3 }
  values:
    operator:
      disable_prometheus_converter: false
      enable_converter_ownership: true
    admissionWebhooks:
      enabled: false
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits:   { memory: 256Mi }
