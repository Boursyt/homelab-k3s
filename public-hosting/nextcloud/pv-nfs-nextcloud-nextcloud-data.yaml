apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-nextcloud-nextcloud-data
spec:
  # hard limit: the UGOS quota of the "nextcloud" share
  capacity: { storage: 300Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-ssd
  mountOptions: [nfsvers=3, hard, noatime]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.1.210/volume1/nextcloud
    volumeAttributes: { server: 192.168.1.210, share: /volume1/nextcloud }
  claimRef: { namespace: nextcloud, name: nextcloud-data }
