mirror-sync:
  stage: mirror
  image: curlimages/curl:8.23.0
  rules:
    - if: $CI_SERVER_HOST == "git.lab.theoboursy.fr" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      ids=$(curl -sS -H "PRIVATE-TOKEN: $MERGE_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/remote_mirrors" | grep -o '"id":[0-9]*' | cut -d: -f2)
      [ -n "$ids" ] || { echo "no push mirror found"; exit 1; }
      for id in $ids; do
        code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "PRIVATE-TOKEN: $MERGE_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/remote_mirrors/$id/sync")
        echo "push mirror $id: sync requested, HTTP $code"
      done
