apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics
  namespace: flux-system
spec:
  path: ./k3s/metrics
  sourceRef: { kind: GitRepository, name: homelab }
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: false   # true once its inventory has been checked (flux tree kustomization metrics)
