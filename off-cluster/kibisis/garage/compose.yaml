services:
  garage:
    image: dxflrs/garage:v2.6.0@sha256:4b5a318fc9fe2fbec5d3af590eeafe05d83492e6411266fa0b9e215c20264013
    container_name: garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?missing in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?missing in .env}
    ports:
      - "192.168.1.210:3900:3900"
      - "192.168.1.210:3903:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /volume2/stacks/garage/meta:/var/lib/garage/meta
      - /volume1/garage:/var/lib/garage/data
