apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef: { kind: HelmRepository, name: jetstack, namespace: flux-system }
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3 }
  values:
    replicaCount: 2
    podDisruptionBudget: { enabled: true, minAvailable: 1 }
    crds:
      enabled: true
      keep: true
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
      - --logging-format=json
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits:   { memory: 192Mi }
    webhook:
      replicaCount: 2
      podDisruptionBudget: { enabled: true, minAvailable: 1 }
      extraArgs: [--logging-format=json]
      resources:
        requests: { cpu: 10m, memory: 24Mi }
        limits:   { memory: 96Mi }
    cainjector:
      replicaCount: 2
      podDisruptionBudget: { enabled: true, minAvailable: 1 }
      extraArgs: [--logging-format=json]
      resources:
        requests: { cpu: 10m, memory: 48Mi }
        limits:   { memory: 192Mi }
