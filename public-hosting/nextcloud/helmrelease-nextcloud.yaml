apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 1h
  # first start installs Nextcloud, upgrades migrate the database
  timeout: 45m
  chart:
    spec:
      chart: nextcloud
      version: 9.4.1
      sourceRef: { kind: HelmRepository, name: nextcloud, namespace: flux-system }
  # no rollback: an older image cannot run on a migrated database
  upgrade:
    remediation: { retries: 0 }
  # the chart keeps code and config on one volume: put the code (/var/www/html) on a per-pod
  # emptyDir instead, filled from the image by the init container "code"; config, apps, themes
  # and data stay on the NAS, so the pod can start on any node
  postRenderers:
    - kustomize:
        patches:
          - target: { kind: Deployment, name: nextcloud }
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: nextcloud }
              spec:
                template:
                  spec:
                    volumes:
                      - { name: code, emptyDir: {} }
                    containers:
                      - name: nextcloud
                        volumeMounts: [{ mountPath: /var/www/html, name: code, subPath: "" }]
                      - name: nextcloud-nginx
                        volumeMounts: [{ mountPath: /var/www/html, name: code, subPath: "" }]
                      - name: nextcloud-cron
                        volumeMounts: [{ mountPath: /var/www/html, name: code, subPath: "" }]
  values:
    image:
      repository: nextcloud
      tag: 35.0.2-fpm

    nextcloud:
      host: cloud.lab.pub.theoboursy.fr
      trustedDomains: [cloud.lab.pub.theoboursy.fr]
      # local break-glass admin; people sign in with Google
      existingSecret:
        enabled: true
        secretName: nextcloud-admin
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
      # port of the nginx sidecar (probes, Service)
      containerPort: 8080
      extraEnv:
        - { name: PGSSLMODE, value: require }
        - { name: PGSSLCERT, value: /tmp/none.crt }
        - { name: PGSSLKEY, value: /tmp/none.key }
        - { name: TRUSTED_PROXIES, value: 10.42.0.0/16 }
        - { name: OVERWRITECLIURL, value: https://cloud.lab.pub.theoboursy.fr }
        - { name: PHP_MEMORY_LIMIT, value: 1G }
        - { name: PHP_UPLOAD_LIMIT, value: 16G }
        - name: OIDC_CLIENT_ID
          valueFrom: { secretKeyRef: { name: nextcloud-oidc, key: client-id } }
        - name: OIDC_CLIENT_SECRET
          valueFrom: { secretKeyRef: { name: nextcloud-oidc, key: client-secret } }
      # mitigation for CVE-2026-115560 (PHP session RCE, no fix released yet)
      phpConfigs:
        zz-homelab.conf: |-
          [www]
          php_admin_flag[session.upload_progress.enabled] = off
      configs:
        homelab.config.php: |-
          <?php
          $CONFIG = array (
            'default_phone_region' => 'FR',
            'maintenance_window_start' => 1,
            // only users pre-provisioned with .helpers/nextcloud-allow.sh may sign in;
            // Google rejects a "claims" parameter with a userinfo key
            'user_oidc' => array ('auto_provision' => false, 'send_userinfo_claims' => false),
            'skeletondirectory' => '',
            // the internal name is used by Collabora (WOPI callbacks inside the cluster)
            'trusted_domains' => array ('cloud.lab.pub.theoboursy.fr', 'nextcloud.nextcloud.svc.cluster.local'),
            // UGOS ACLs show every NAS file as 0777, whatever its mode
            'check_data_directory_permissions' => false,
          );
      # theme, loaded by the start hook into the Custom CSS app
        catppuccin.css: |-
          /* Catppuccin for Nextcloud: Latte (light), Mocha (dark), accent mauve. https://catppuccin.com/palette */
          html body[data-theme-default], html body[data-theme-light] {
            --ctp-base: #eff1f5; --ctp-base-rgb: 239,241,245; --ctp-mantle: #e6e9ef; --ctp-crust: #dce0e8; --ctp-crust-rgb: 220,224,232;
            --ctp-text: #4c4f69; --ctp-subtext1: #5c5f77; --ctp-subtext0: #6c6f85; --ctp-overlay1: #8c8fa1; --ctp-overlay0: #9ca0b0;
            --ctp-surface1: #bcc0cc; --ctp-surface0: #ccd0da; --ctp-hover: #e6e9ef;
            --ctp-accent: #8839ef; --ctp-accent-hover: #7287fd; --ctp-on-accent: #eff1f5; --ctp-accent-soft: #e3d4fb; --ctp-accent-soft-hover: #d8c2fa;
            --ctp-red: #d20f39; --ctp-green: #40a02b; --ctp-green-text: #2f7a1f; --ctp-yellow: #df8e1d; --ctp-yellow-text: #a8650a; --ctp-blue: #1e66f5;
            --ctp-red-bg: 246,211,218; --ctp-yellow-bg: 247,230,204; --ctp-green-bg: 214,236,210; --ctp-blue-bg: 211,225,251;
          }
          html body[data-theme-dark] {
            --ctp-base: #1e1e2e; --ctp-base-rgb: 30,30,46; --ctp-mantle: #181825; --ctp-crust: #11111b; --ctp-crust-rgb: 17,17,27;
            --ctp-text: #cdd6f4; --ctp-subtext1: #bac2de; --ctp-subtext0: #a6adc8; --ctp-overlay1: #7f849c; --ctp-overlay0: #6c7086;
            --ctp-surface1: #45475a; --ctp-surface0: #313244; --ctp-hover: #313244;
            --ctp-accent: #cba6f7; --ctp-accent-hover: #b4befe; --ctp-on-accent: #1e1e2e; --ctp-accent-soft: #3b3150; --ctp-accent-soft-hover: #4a3d65;
            --ctp-red: #f38ba8; --ctp-green: #a6e3a1; --ctp-green-text: #a6e3a1; --ctp-yellow: #f9e2af; --ctp-yellow-text: #f9e2af; --ctp-blue: #89b4fa;
            --ctp-red-bg: 74,38,51; --ctp-yellow-bg: 74,63,43; --ctp-green-bg: 43,63,46; --ctp-blue-bg: 38,58,79;
          }
          @media (prefers-color-scheme: dark) {
            html body[data-theme-default] {
              --ctp-base: #1e1e2e; --ctp-base-rgb: 30,30,46; --ctp-mantle: #181825; --ctp-crust: #11111b; --ctp-crust-rgb: 17,17,27;
              --ctp-text: #cdd6f4; --ctp-subtext1: #bac2de; --ctp-subtext0: #a6adc8; --ctp-overlay1: #7f849c; --ctp-overlay0: #6c7086;
              --ctp-surface1: #45475a; --ctp-surface0: #313244; --ctp-hover: #313244;
              --ctp-accent: #cba6f7; --ctp-accent-hover: #b4befe; --ctp-on-accent: #1e1e2e; --ctp-accent-soft: #3b3150; --ctp-accent-soft-hover: #4a3d65;
              --ctp-red: #f38ba8; --ctp-green: #a6e3a1; --ctp-green-text: #a6e3a1; --ctp-yellow: #f9e2af; --ctp-yellow-text: #f9e2af; --ctp-blue: #89b4fa;
              --ctp-red-bg: 74,38,51; --ctp-yellow-bg: 74,63,43; --ctp-green-bg: 43,63,46; --ctp-blue-bg: 38,58,79;
            }
          }
          /* Nextcloud variables -> palette */
          html body[data-theme-default], html body[data-theme-light], html body[data-theme-dark] {
            --image-background: none;
            --color-main-background: var(--ctp-base); --color-main-background-rgb: var(--ctp-base-rgb); --color-main-text: var(--ctp-text);
            --color-background-hover: var(--ctp-hover); --color-background-dark: var(--ctp-hover); --color-background-darker: var(--ctp-surface0);
            --color-background-plain: var(--ctp-crust); --color-background-plain-text: var(--ctp-text);
            --color-placeholder-light: var(--ctp-surface0); --color-placeholder-dark: var(--ctp-surface1);
            --color-text-maxcontrast: var(--ctp-subtext0); --color-text-maxcontrast-default: var(--ctp-subtext0); --color-text-maxcontrast-background-blur: var(--ctp-subtext1);
            --color-border: var(--ctp-surface0); --color-border-dark: var(--ctp-surface1); --color-border-maxcontrast: var(--ctp-overlay0);
            --color-box-shadow-rgb: var(--ctp-crust-rgb); --color-loading-light: var(--ctp-surface1); --color-loading-dark: var(--ctp-overlay1);
            --color-primary: var(--ctp-accent); --color-primary-text: var(--ctp-on-accent); --color-primary-hover: var(--ctp-accent-hover);
            --color-primary-element: var(--ctp-accent); --color-primary-element-hover: var(--ctp-accent-hover);
            --color-primary-element-text: var(--ctp-on-accent); --color-primary-element-text-dark: var(--ctp-on-accent);
            --color-primary-light: var(--ctp-accent-soft); --color-primary-light-text: var(--ctp-accent); --color-primary-light-hover: var(--ctp-accent-soft-hover);
            --color-element-error: var(--ctp-red); --color-element-success: var(--ctp-green); --color-element-warning: var(--ctp-yellow); --color-element-info: var(--ctp-blue);
            --color-text-error: var(--ctp-red); --color-text-success: var(--ctp-green-text); --color-favorite: var(--ctp-yellow);
            --color-error: rgb(var(--ctp-red-bg)); --color-error-rgb: var(--ctp-red-bg); --color-error-hover: rgba(var(--ctp-red-bg), .8); --color-error-text: var(--ctp-red);
            --color-warning: rgb(var(--ctp-yellow-bg)); --color-warning-rgb: var(--ctp-yellow-bg); --color-warning-hover: rgba(var(--ctp-yellow-bg), .8); --color-warning-text: var(--ctp-yellow-text);
            --color-success: rgb(var(--ctp-green-bg)); --color-success-rgb: var(--ctp-green-bg); --color-success-hover: rgba(var(--ctp-green-bg), .8); --color-success-text: var(--ctp-green-text);
            --color-info: rgb(var(--ctp-blue-bg)); --color-info-rgb: var(--ctp-blue-bg); --color-info-hover: rgba(var(--ctp-blue-bg), .8); --color-info-text: var(--ctp-blue);
            --color-mark: rgb(var(--ctp-yellow-bg));
          }
          /* header logo: the white SVG used as a mask, filled with the palette text colour */
          #nextcloud .logo {
            -webkit-mask: url(/core/img/logo/logo.svg) center / contain no-repeat;
            mask: url(/core/img/logo/logo.svg) center / contain no-repeat;
            background: #4c4f69 !important;
          }
          html body[data-theme-dark] #nextcloud .logo { background: #cdd6f4 !important; }
          @media (prefers-color-scheme: dark) {
            html body[data-theme-default] #nextcloud .logo { background: #cdd6f4 !important; }
          }
      hooks:
        before-starting: |-
          #!/bin/sh
          set -eu
          occ() { php /var/www/html/occ "$@"; }
          occ status --output=json | grep -q '"installed":true' || { echo "hook: not installed, skipped"; exit 0; }
          # installed version, restored into the per-pod code by the init container "code"
          cp /var/www/html/version.php /var/www/html/config/.image-version
          occ app:list --output=json | grep -q '"user_oidc"' || occ app:install user_oidc
          for app in calendar contacts tasks notes deck forms bookmarks memories; do
            occ app:list --output=json | grep -q "\"$app\"" || occ app:install $app
          done
          occ app:update --all || true
          occ config:app:set files default_quota --value "50 GB"
          # https comes from nginx; a forced protocol breaks Collabora's WOPI proof (plain http inside the cluster)
          occ config:system:delete overwriteprotocol
          # look: name, links, Catppuccin colours (configs: catppuccin.css)
          occ theming:config name "theoboursy cloud"
          occ theming:config url https://theoboursy.fr/cloud
          occ theming:config privacyUrl https://theoboursy.fr/cloud/privacy
          occ theming:config imprintUrl https://theoboursy.fr/legal.html
          occ theming:config primary_color "#8839ef"
          # let people pick light, dark or system in Settings > Appearance
          occ theming:config disable-user-theming no
          # no "Nextcloud Hub" welcome slideshow
          occ app:disable firstrunwizard || true
          occ app:list --output=json | grep -q '"theming_customcss"' || occ app:install theming_customcss
          occ config:app:set theming_customcss customcss --value "$(cat /var/www/html/config/catppuccin.css)"
          occ config:app:set theming_customcss cachebuster --value "$(md5sum < /var/www/html/config/catppuccin.css | cut -c1-8)"
          # Nextcloud Office: browsers use office.lab.pub, Nextcloud and Collabora talk inside the cluster
          occ app:list --output=json | grep -q '"richdocuments"' || occ app:install richdocuments
          occ config:app:set richdocuments public_wopi_url --value https://office.lab.pub.theoboursy.fr
          occ config:app:set richdocuments wopi_allowlist --value 10.42.0.0/16
          occ richdocuments:activate-config --wopi-url http://collabora-collabora-online.collabora.svc.cluster.local:9980 \
            --callback-url http://nextcloud.nextcloud.svc.cluster.local:8080 || echo "hook: Collabora not reachable yet"
          if [ -n "${OIDC_CLIENT_ID:-}" ]; then
            occ user_oidc:provider Google --clientid="$OIDC_CLIENT_ID" --clientsecret-env=OIDC_CLIENT_SECRET \
              --discoveryuri=https://accounts.google.com/.well-known/openid-configuration \
              --scope="openid email profile" --unique-uid=0 --check-bearer=0 --bearer-provisioning=0 \
              --mapping-uid=email --mapping-email=email --mapping-display-name=name
            # straight to Google; local login stays at /login?direct=1
            occ config:app:set --type=string --value=0 user_oidc allow_multiple_user_backends
          fi
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000       # UGOS ACLs only let known NAS uids through NFS
        runAsGroup: 1000
        # no fsGroup: kubelet would chown every file on the NFS volumes at each start
        seccompProfile: { type: RuntimeDefault }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
      # the entrypoint writes the Redis session config into conf.d, which only root may do
      extraInitContainers:
        # code from the image (seconds on local disk) + the installed version, so the
        # entrypoint only syncs and upgrades when the image is newer
        - name: code
          image: nextcloud:35.0.2-fpm
          command:
            - sh
            - -ec
            - |
              cd /usr/src/nextcloud
              for f in * .[!.]*; do
                case "$f" in config|data|custom_apps|themes|version.php) ;; *) cp -a "$f" /code/ ;; esac
              done
              if [ -f /persist/.image-version ]; then
                cp /persist/.image-version /code/version.php
              elif grep -qs "'installed' => true" /persist/config.php; then
                cp version.php /code/version.php
              fi
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: code, mountPath: /code }
            - { name: nextcloud-main, mountPath: /persist, subPath: config }
        - name: redis-session-ini
          image: busybox:1.38
          command: [touch, /php-session/redis-session.ini]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: php-session, mountPath: /php-session }]
      extraVolumes:
        - { name: php-session, emptyDir: {} }
      extraVolumeMounts:
        - { name: php-session, mountPath: /usr/local/etc/php/conf.d/redis-session.ini, subPath: redis-session.ini }
      # the new pod starts while the old one serves; both share Valkey (deployment-valkey.yaml)
      strategy:
        type: RollingUpdate
        rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }

    nginx:
      enabled: true
      image:
        repository: nginxinc/nginx-unprivileged
        tag: 1.31.7-alpine
      containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
      config:
        headers:
          "Strict-Transport-Security": "max-age=15768000; includeSubDomains"
        serverBlockCustom: |
          client_max_body_size 16G;
          client_body_timeout 300s;
          fastcgi_buffers 64 4K;
          fastcgi_read_timeout 3600s;
          # Collabora calls these over plain http inside the cluster and signs that URL (WOPI proof):
          # PHP must not see HTTPS=on here (the chart sets it for every .php request)
          location ^~ /index.php/apps/richdocuments/wopi/ {
            fastcgi_split_path_info ^(/index\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS off;
            fastcgi_param modHeadersAvailable true;
            fastcgi_param front_controller_active true;
            fastcgi_pass php-handler;
            fastcgi_request_buffering off;
          }
          # uploads (WebDAV): stream to PHP instead of spooling each chunk to a temp file first
          location ^~ /remote.php/ {
            fastcgi_split_path_info ^(/remote\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS on;
            fastcgi_param modHeadersAvailable true;
            fastcgi_param front_controller_active true;
            fastcgi_pass php-handler;
            fastcgi_request_buffering off;
          }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 64Mi }

    # busybox crond needs root: plain loop instead
    cronjob:
      enabled: true
      type: sidecar
      sidecar:
        command: [sh, -c, "while true; do sleep 300; php -f /var/www/html/cron.php; done"]
        securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
        resources:
          requests: { cpu: 10m, memory: 64Mi }
          limits: { memory: 512Mi }

    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: postgres-public.databases.svc.cluster.local:5432
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-db
        usernameKey: db-username
        passwordKey: db-password
    externalRedis:
      enabled: true
      host: valkey.nextcloud.svc.cluster.local
      port: "6379"

    # code + config on the NVMe share, files on the HDD share
    persistence:
      enabled: true
      existingClaim: nextcloud-html
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data

    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 2Gi }
    # first install and upgrades migrate the database
    startupProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 240
    nodeSelector:
      kubernetes.io/arch: amd64
