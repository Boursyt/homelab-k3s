apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: openwebui
  labels: { app.kubernetes.io/name: tika }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: tika }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tika }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 35002   # image user
        runAsGroup: 35002
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: tika
          image: apache/tika:4.1.0-1-full
          ports:
            - { name: http, containerPort: 9998 }
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-Xmx768m -Djava.io.tmpdir=/tmp" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /tika, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /tika, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { memory: 1536Mi }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
