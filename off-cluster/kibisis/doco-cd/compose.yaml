services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.138.0@sha256:9d8d10b795f7ef4372088475fd16277d7b79a0e85434fbfc34270e26fb90ddea
    container_name: doco-cd
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      SOPS_AGE_KEY_FILE: /run/secrets/age.agekey
      POLL_CONFIG: |
        - url: https://gitlab.com/Boursyt/homelab-k3s.git
          reference: main
          interval: 3m
          target: nas
    ports:
      - "192.168.1.210:9180:80"
      - "192.168.1.210:9120:9120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume2/stacks/doco-cd/data:/data
      - /volume2/stacks/doco-cd/age.agekey:/run/secrets/age.agekey:ro
