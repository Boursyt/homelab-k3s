apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-backup-nextcloud-ro
spec:
  capacity: { storage: 300Gi }
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-ssd
  mountOptions: [nfsvers=3, hard, noatime, ro]
  csi:
    driver: nfs.csi.k8s.io
    readOnly: true
    volumeHandle: 192.168.1.210/volume1/nextcloud#ro
    volumeAttributes: { server: 192.168.1.210, share: /volume1/nextcloud }
  claimRef: { namespace: backup, name: nextcloud-ro }
