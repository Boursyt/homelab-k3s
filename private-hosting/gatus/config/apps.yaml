endpoints:
  - name: Grafana
    group: Apps
    extra-labels: { desc: "metrics dashboards", section: "Monitoring", href: "https://grafana.lab.theoboursy.fr", order: "21" }
    url: "https://grafana.lab.theoboursy.fr/api/health"
    interval: 1m
    alerts: [{ type: ntfy }]
    conditions:
      - "[STATUS] == 200"
      - "[BODY].database == ok"
      - "[CERTIFICATE_EXPIRATION] > 336h"
  - name: Gitea
    group: Apps
    extra-labels: { desc: "git hosting, mirrored to GitHub", section: "Apps", href: "https://git.lab.theoboursy.fr", order: "11" }
    url: "https://git.lab.theoboursy.fr/api/healthz"
    interval: 1m
    alerts: [{ type: ntfy }]
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
