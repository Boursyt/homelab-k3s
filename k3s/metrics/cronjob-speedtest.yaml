apiVersion: batch/v1
kind: CronJob
metadata:
  name: speedtest
  namespace: monitoring
spec:
  schedule: "17 */6 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: tmp
              emptyDir: { sizeLimit: 64Mi }
          containers:
            - name: speedtest
              image: alpine:3.22
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
              env:
                - { name: HOME, value: /tmp }
                - { name: VM_USER, valueFrom: { secretKeyRef: { name: victoriametrics-auth, key: username } } }
                - { name: VM_PASSWORD, valueFrom: { secretKeyRef: { name: victoriametrics-auth, key: password } } }
              command:
                - sh
                - -euc
                - |
                  cd /tmp
                  wget -qO cli.tgz https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-aarch64.tgz
                  tar xzf cli.tgz speedtest
                  for try in 1 2 3; do
                    if ./speedtest --accept-license --accept-gdpr --server-id=62493 -f tsv --output-header 2>/dev/null | tail -2 > out.tsv && [ "$(wc -l < out.tsv)" -eq 2 ]; then break; fi
                    echo "speedtest attempt $try failed"; [ "$try" -lt 3 ] && sleep 30
                  done
                  [ "$(wc -l < out.tsv)" -eq 2 ]
                  awk -F'\t' -v now="$(date +%s)" '
                    NR == 1 { for (i = 1; i <= NF; i++) h[$i] = i; next }
                    {
                      s = $h["server name"]; gsub(/"/, "", s); l = "source=\"cluster\",server=\"" s "\""
                      printf "speedtest_download_bits_per_second{%s} %.0f\n", l, $h["download"] * 8
                      printf "speedtest_upload_bits_per_second{%s} %.0f\n", l, $h["upload"] * 8
                      printf "speedtest_ping_ms{%s} %s\n", l, $h["idle latency"]
                      printf "speedtest_jitter_ms{%s} %s\n", l, $h["idle jitter"]
                      printf "speedtest_last_run_timestamp_seconds{%s} %s\n", l, now
                    }' out.tsv > metrics.txt
                  cat metrics.txt
                  auth=$(printf '%s:%s' "$VM_USER" "$VM_PASSWORD" | base64 | tr -d '\n')
                  wget -qO- --header "Authorization: Basic $auth" --post-file metrics.txt \
                    http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/import/prometheus
                  echo "pushed"
              resources:
                requests: { cpu: 100m, memory: 32Mi }
                limits:   { memory: 256Mi }
