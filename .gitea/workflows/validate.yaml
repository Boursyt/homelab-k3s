name: validate
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: No secrets in the PR
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --no-banner --redact --log-opts=origin/${{ github.base_ref }}..HEAD .

      - uses: fluxcd/flux2/action@v2.9.6

      - name: Render every Flux Kustomization
        run: .gitea/validate.sh

      - name: Every object is valid
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          args: >-
            -strict -summary -ignore-missing-schemas
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            rendered

  merge:
    needs: validate
    if: ${{ !startsWith(github.head_ref, 'renovate/manual-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Update the branch if it is behind main
        id: update
        run: |
          git fetch -q origin main
          if git merge-base --is-ancestor origin/main ${{ github.event.pull_request.head.sha }}; then exit 0; fi
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
            -H "Authorization: token ${{ secrets.MERGE_TOKEN }}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/update?style=merge")
          echo "HTTP $code"; cat /tmp/out
          [ "$code" = 200 ]
          echo "Branch updated: the new run validates and merges it"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Squash-merge the PR into main
        if: steps.update.outputs.updated != 'true'
        run: |
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
            -H "Authorization: token ${{ secrets.MERGE_TOKEN }}" -H "Content-Type: application/json" \
            -d '{"Do":"squash","delete_branch_after_merge":true}' \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/merge")
          echo "HTTP $code"; cat /tmp/out
          [ "$code" = 200 ]
