apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: glance
  labels: { app.kubernetes.io/name: glance }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: glance }
  template:
    metadata:
      labels: { app.kubernetes.io/name: glance }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app.kubernetes.io/name: glance }
      containers:
        - name: glance
          image: glanceapp/glance:v0.8.6
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: VM_USER, valueFrom: { secretKeyRef: { name: victoriametrics-auth, key: username } } }
            - { name: VM_PASSWORD, valueFrom: { secretKeyRef: { name: victoriametrics-auth, key: password } } }
            - { name: OPENROUTER_API_KEY, valueFrom: { secretKeyRef: { name: llm-keys, key: OPENROUTER_API_KEY } } }
            - { name: HA_TOKEN, valueFrom: { secretKeyRef: { name: homeassistant-token, key: token } } }
          volumeMounts:
            - { name: config, mountPath: /app/config, readOnly: true }
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 128Mi }
      volumes:
        - name: config
          configMap:
            name: glance-config
