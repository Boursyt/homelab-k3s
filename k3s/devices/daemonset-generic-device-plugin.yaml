apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels: { app.kubernetes.io/name: generic-device-plugin }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: generic-device-plugin }
  template:
    metadata:
      labels: { app.kubernetes.io/name: generic-device-plugin }
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      # only node with a USB device to share
      nodeSelector:
        kubernetes.io/hostname: aegis
      containers:
        - name: generic-device-plugin
          image: squat/generic-device-plugin:2cc50b0
          args:
            - --domain=homelab
            # Zigbee dongle, given to the pod at /dev/zigbee
            - --device
            - |
              name: zigbee
              groups:
                - paths:
                    - path: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_*
                      mountPath: /dev/zigbee
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            privileged: true   # registers devices with the kubelet
          volumeMounts:
            - { name: device-plugins, mountPath: /var/lib/kubelet/device-plugins }
            - { name: dev, mountPath: /dev }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits:   { memory: 64Mi }
      volumes:
        - name: device-plugins
          hostPath: { path: /var/lib/kubelet/device-plugins }
        - name: dev
          hostPath: { path: /dev }
