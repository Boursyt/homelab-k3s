- type: custom-api
  title: Backups · detail
  cache: 5m
  url: http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/query
  basic-auth: { username: "${VM_USER}", password: "${VM_PASSWORD}" }
  parameters:
    query: |
      union(
        label_set((time() - max(last_over_time(backup_last_success_timestamp_seconds{job="pg-dump"}[30d]))) / 3600, "k", "a1"),
        label_set((time() - max(last_over_time(backup_last_success_timestamp_seconds{job="pg-dump-public"}[30d]))) / 3600, "k", "a2"),
        label_set((time() - max(last_over_time(backup_last_success_timestamp_seconds{job="pg-dump-gitlab"}[30d]))) / 3600, "k", "a3"),
        label_set((time() - max(last_over_time(backup_last_success_timestamp_seconds{job="restic"}[30d]))) / 3600, "k", "a4"),
        label_set((time() - max(last_over_time(kube_cronjob_status_last_successful_time{cronjob="garage-backup"}[30d]))) / 3600, "k", "a5"),
        label_set((time() - max(last_over_time(kube_cronjob_status_last_successful_time{cronjob="gitlab-toolbox-backup"}[30d]))) / 3600, "k", "a6"),
        label_set(max(last_over_time(backup_size_bytes{job="pg-dump"}[30d])) / 1e6, "k", "s1"),
        label_set(max(last_over_time(backup_size_bytes{job="pg-dump-public"}[30d])) / 1e6, "k", "s2"),
        label_set(max(last_over_time(backup_size_bytes{job="pg-dump-gitlab"}[30d])) / 1e6, "k", "s3"),
        label_set(max(last_over_time(backup_size_bytes{job="restic"}[30d])) / 1e6, "k", "s4"),
        label_set(max(last_over_time(backup_snapshots{job="restic"}[30d])), "k", "snaps")
      )
  template: |
    {{ $a1 := 999.0 }}{{ $s1 := 0.0 }}{{ $a2 := 999.0 }}{{ $s2 := 0.0 }}{{ $a3 := 999.0 }}{{ $s3 := 0.0 }}{{ $a4 := 999.0 }}{{ $s4 := 0.0 }}{{ $a5 := 999.0 }}{{ $s5 := 0.0 }}{{ $a6 := 999.0 }}{{ $s6 := 0.0 }}{{ $snaps := 0.0 }}
    {{ range .JSON.Array "data.result" }}{{ $k := .String "metric.k" }}{{ $x := .Float "value.1" }}{{ if eq $k "a1" }}{{ $a1 = $x }}{{ end }}{{ if eq $k "a2" }}{{ $a2 = $x }}{{ end }}{{ if eq $k "a3" }}{{ $a3 = $x }}{{ end }}{{ if eq $k "a4" }}{{ $a4 = $x }}{{ end }}{{ if eq $k "a5" }}{{ $a5 = $x }}{{ end }}{{ if eq $k "a6" }}{{ $a6 = $x }}{{ end }}{{ if eq $k "s1" }}{{ $s1 = $x }}{{ end }}{{ if eq $k "s2" }}{{ $s2 = $x }}{{ end }}{{ if eq $k "s3" }}{{ $s3 = $x }}{{ end }}{{ if eq $k "s4" }}{{ $s4 = $x }}{{ end }}{{ if eq $k "snaps" }}{{ $snaps = $x }}{{ end }}{{ end }}
    <ul class="list list-gap-10">
      <li class="kv"><span class="color-highlight text-truncate">pg private</span><span class="shrink-0">{{ if gt $s1 0.0 }}<span class="color-subdue">{{ printf "%.1f" $s1 }} MB</span> {{ end }}<span class="color-subdue">{{ if ge $a1 999.0 }}no run yet{{ else }}{{ printf "%.0f" $a1 }} h ago{{ end }}</span> {{ if and (gt $a1 50.0) (lt $a1 999.0) }}<span class="color-negative">●</span>{{ else if gt $a1 26.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></li>
      <li class="kv"><span class="color-highlight text-truncate">pg public</span><span class="shrink-0">{{ if gt $s2 0.0 }}<span class="color-subdue">{{ printf "%.1f" $s2 }} MB</span> {{ end }}<span class="color-subdue">{{ if ge $a2 999.0 }}no run yet{{ else }}{{ printf "%.0f" $a2 }} h ago{{ end }}</span> {{ if and (gt $a2 50.0) (lt $a2 999.0) }}<span class="color-negative">●</span>{{ else if gt $a2 26.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></li>
      <li class="kv"><span class="color-highlight text-truncate">pg GitLab</span><span class="shrink-0">{{ if gt $s3 0.0 }}<span class="color-subdue">{{ printf "%.1f" $s3 }} MB</span> {{ end }}<span class="color-subdue">{{ if ge $a3 999.0 }}no run yet{{ else }}{{ printf "%.0f" $a3 }} h ago{{ end }}</span> {{ if and (gt $a3 50.0) (lt $a3 999.0) }}<span class="color-negative">●</span>{{ else if gt $a3 26.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></li>
      <li class="kv"><span class="color-highlight text-truncate">restic</span><span class="shrink-0">{{ if gt $s4 0.0 }}<span class="color-subdue">{{ printf "%.1f" $s4 }} MB</span> {{ end }}<span class="color-subdue">{{ if ge $a4 999.0 }}no run yet{{ else }}{{ printf "%.0f" $a4 }} h ago{{ end }}</span> {{ if and (gt $a4 50.0) (lt $a4 999.0) }}<span class="color-negative">●</span>{{ else if gt $a4 26.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></li>
      <li class="kv"><span class="color-highlight text-truncate">Garage</span><span class="shrink-0"><span class="color-subdue">{{ if ge $a5 999.0 }}no run yet{{ else }}{{ printf "%.0f" $a5 }} h ago{{ end }}</span> {{ if and (gt $a5 50.0) (lt $a5 999.0) }}<span class="color-negative">●</span>{{ else if gt $a5 26.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></li>
      <li class="kv"><span class="color-highlight text-truncate">GitLab data</span><span class="shrink-0"><span class="color-subdue">{{ if ge $a6 999.0 }}no run yet{{ else }}{{ printf "%.0f" $a6 }} h ago{{ end }}</span> {{ if and (gt $a6 50.0) (lt $a6 999.0) }}<span class="color-negative">●</span>{{ else if gt $a6 26.0 }}<span class="color-warn">●</span>{{ else }}<span class="color-positive">●</span>{{ end }}</span></li>
    </ul>
    <div class="stat-row"><div><div class="color-highlight size-h4">{{ printf "%.0f" $snaps }}</div><div class="size-h6">restic snapshots</div></div></div>
    <div class="size-h6 color-subdue text-center margin-top-10">00:00 GitLab · 02:30 dumps · 03:00 Garage · 03:30 restic → GCS</div>
