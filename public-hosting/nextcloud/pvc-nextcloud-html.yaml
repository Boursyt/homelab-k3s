apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
  namespace: nextcloud
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-ssd
  volumeName: nfs-nextcloud-nextcloud-html
  resources: { requests: { storage: 10Gi } }
