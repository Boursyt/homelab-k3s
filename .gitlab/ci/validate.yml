gitleaks:
  stage: validate
  image: { name: "ghcr.io/gitleaks/gitleaks:v8.30.1", entrypoint: [""] }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - gitleaks git --no-banner --redact --log-opts="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD" .

render:
  stage: validate
  image: { name: "ghcr.io/fluxcd/flux-cli:v2.10.1", entrypoint: [""] }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - sh .gitlab/scripts/validate.sh
  artifacts:
    paths: [rendered/]
    expire_in: 1 day

kubeconform:
  stage: validate
  needs: [render]
  image: { name: "ghcr.io/yannh/kubeconform:v0.8.0-alpine", entrypoint: [""] }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - >-
      /kubeconform -strict -summary -ignore-missing-schemas
      -schema-location default
      -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      rendered
