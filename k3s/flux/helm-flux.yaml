apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: flux
  namespace: kube-system
spec:
  repo: https://fluxcd-community.github.io/helm-charts
  chart: flux2
  version: 2.19.1
  targetNamespace: flux-system
  failurePolicy: abort
  valuesContent: |-
    # charts are Flux HelmReleases; no image automation
    helmController:
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits:   { memory: 512Mi }
    imageAutomationController:
      create: false
    imageReflectionController:
      create: false
    sourceController:
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits:   { memory: 256Mi }
    kustomizeController:
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits:   { memory: 512Mi }
    notificationController:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits:   { memory: 128Mi }
