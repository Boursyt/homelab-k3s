apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collabora
  namespace: collabora
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure-pub
spec:
  ingressClassName: traefik
  rules:
    - host: office.lab.pub.theoboursy.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: collabora-collabora-online, port: { number: 9980 } }
