apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-users
  namespace: nextcloud-users
  labels: { app.kubernetes.io/name: nextcloud-users }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nextcloud-users }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nextcloud-users }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: python:3.15.2-alpine3.24
          command: [python, /app/app.py]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: NEXTCLOUD_URL, value: http://nextcloud.nextcloud.svc.cluster.local:8080 }
            - { name: NEXTCLOUD_HOST, value: cloud.lab.pub.theoboursy.fr }
          envFrom:
            - secretRef: { name: nextcloud-admin }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 96Mi }
      volumes:
        - name: app
          configMap: { name: nextcloud-users }
