apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: glance
resources:
  - namespace.yaml
  - deployment-glance.yaml
  - ingress-glance.yaml
  - pdb-glance.yaml
  - secret-homeassistant-token.sops.yaml
  - secret-gitlab-token.sops.yaml
  - secret-llm-keys.sops.yaml
  - secret-victoriametrics-auth.sops.yaml
  - service-glance.yaml
configMapGenerator:
  - name: glance-config
    files:
      - config/glance.yml
      - config/theme.yml
      - config/homelab.yml
      - config/hardware.yml
      - config/k3s.yml
      - config/nas.yml
      - config/apps.yml
      - config/printer.yml
      - config/public.yml
      - config/network.yml
      - config/speedtest.yml
      - config/databases.yml
      - config/backups.yml
      - config/ingress.yml
      - config/status.yml
      - config/page-db.yml
      - config/page-network.yml
      - config/page-git.yml
      - config/page-apps.yml
      - config/db-private.yml
      - config/db-public.yml
      - config/db-gitlab.yml
      - config/backups-detail.yml
      - config/git-mrs.yml
      - config/git-pipelines.yml
      - config/git-main.yml
      - config/apps-namespaces.yml
      - config/apps-traffic.yml
      - config/traffic.yml
