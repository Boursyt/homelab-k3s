apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 1h
  chart:
    spec:
      chart: headlamp
      version: 0.45.0
      sourceRef: { kind: HelmRepository, name: headlamp, namespace: flux-system }
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3 }
  values:
    clusterRoleBinding:
      create: false

    # load plugins installed by the plugin sidecar after start
    config:
      watchPlugins: true

    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - host: headlamp.lab.theoboursy.fr
          paths:
            - path: /
              type: Prefix

    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits:   { memory: 128Mi }

    # Flux plugin (Kustomizations, HelmReleases, sources), installed by a sidecar at start
    pluginsManager:
      enabled: true
      baseImage: node:24-alpine
      version: 0.1.1
      configContent: |
        plugins:
          - name: flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.7.0
      resources:
        requests: { cpu: 10m, memory: 64Mi }
        limits:   { memory: 256Mi }
