apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud-users
  namespace: nextcloud-users
spec:
  ingressClassName: traefik
  rules:
    - host: users.lab.theoboursy.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: nextcloud-users, port: { name: http } }
